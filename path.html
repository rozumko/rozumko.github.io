<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Карта пригод — Розумко</title>
  <meta name="description" content="Навчальний шлях Розумко для 2 класу: точки з іграми, головоломками та місіями з інформатики, мислення й основ ШІ." />
  <meta name="robots" content="noindex" />
  <link rel="canonical" href="https://rozumko.com/path.html" />

  <meta name="theme-color" content="#3b82f6" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="tokens.css"/>
  <link rel="stylesheet" href="style.css"/>
  <link rel="stylesheet" href="style-app.css"/>
  <link rel="stylesheet" href="style-path.css"/>
</head>
<body class="app-page">
  <a href="#main-content" class="skip-link">Перейти до основного контенту</a>
  <div id="site-header"></div>

  <main id="main-content" class="app-main" tabindex="-1">

    <!-- MAP: карта шляху з точками-активностями -->
    <section id="path-map-screen">
      <h1 class="app-title">Карта пригод</h1>
      <p class="app-subtitle" id="path-subtitle">Проходь точки — відкривай нові!</p>
      <div id="path-map" class="path-map">
        <svg id="path-edges" class="path-map__edges" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"></svg>
        <div id="path-nodes" class="path-map__nodes" role="group" aria-label="Точки шляху"></div>
      </div>
      <p id="path-error" class="quiz-feedback quiz-feedback--incorrect app-error" aria-live="polite"></p>
    </section>

    <!-- ACTIVITY: спільна обгортка для гри/головоломок/місії -->
    <section id="path-activity" class="hidden">
      <div class="app-actions path-activity__bar">
        <button id="path-back-btn" class="btn-ghost">← До карти</button>
        <span id="path-activity-title" class="path-activity__title"></span>
      </div>

      <div id="path-sorting-root" class="hidden" aria-label="Ігрове поле"></div>
      <div id="path-puzzles-root" class="hidden" aria-label="Головоломки"></div>
      <div id="path-fo-root" class="hidden" aria-label="Факт чи думка"></div>

      <!-- Розмітка й ID — спільний контракт з mission-runner -->
      <div id="mission-quiz" class="hidden">
        <div class="quiz-progress-header" style="margin-bottom:8px;">
          <span id="quiz-progress-text" class="quiz-progress-text"></span>
        </div>
        <div class="quiz-progress-bar-wrap" aria-hidden="true">
          <div id="quiz-progress-bar" class="quiz-progress-bar" style="width:0%"></div>
        </div>
        <div id="quiz-question-card" class="quiz-question-card" tabindex="-1">
          <p id="quiz-question-text" class="quiz-question-text"></p>
          <img id="quiz-image" src="" alt="Зображення до питання" class="quiz-image hidden" />
        </div>
        <pre id="quiz-code-block" class="quiz-code hidden"></pre>
        <div id="quiz-options" class="quiz-options" role="radiogroup" aria-labelledby="quiz-question-text"></div>
        <div class="quiz-feedback-wrap">
          <p id="quiz-feedback"    class="quiz-feedback"    aria-live="polite"></p>
          <p id="quiz-explanation" class="quiz-explanation hidden"></p>
          <button id="quiz-next-btn" class="btn-next hidden">Далі →</button>
        </div>
      </div>
    </section>

    <!-- DONE: точка пройдена -->
    <section id="path-done" class="hidden">
      <div class="finish-card">
        <p id="path-done-icon" class="finish-card__stars" aria-hidden="true">🏆</p>
        <p id="path-done-title" class="finish-card__label"></p>
        <p id="path-done-stars" class="finish-card__stars"></p>
        <p id="path-done-message" class="finish-card__message"></p>
      </div>
      <div class="app-actions">
        <button id="path-done-map-btn" class="kid-action">На карту →</button>
      </div>
    </section>

  </main>

  <div id="site-footer"></div>
  <script type="module" src="layout.js"></script>
  <script type="module" src="path.js"></script>
</body>
</html>
