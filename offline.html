<!DOCTYPE html>
<html lang="uk">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Немає з'єднання — Розумко</title>
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
  <meta name="theme-color" content="#7c3aed">
  <!-- Інлайн-стилі: ця сторінка показується БЕЗ інтернету, тому CDN недоступний -->
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Montserrat', system-ui, sans-serif;
      background: linear-gradient(135deg, #4c1d95 0%, #1e40af 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .card {
      width: 100%;
      max-width: 22rem;
      text-align: center;
    }
    .icon { font-size: 4.5rem; margin-bottom: 1.5rem; }
    h1 { color: #fff; font-size: 1.5rem; font-weight: 700; margin-bottom: .5rem; }
    .subtitle {
      color: rgba(255,255,255,.7);
      font-size: .875rem;
      line-height: 1.6;
      margin-bottom: 2rem;
    }
    .backup-hint {
      display: none;
      background: rgba(255,255,255,.1);
      border: 1px solid rgba(255,255,255,.2);
      border-radius: 1rem;
      padding: 1rem;
      margin-bottom: 1.5rem;
      text-align: left;
    }
    .backup-hint__title {
      color: #fff;
      font-weight: 600;
      font-size: .875rem;
      margin-bottom: .25rem;
    }
    .backup-hint__desc {
      color: rgba(255,255,255,.7);
      font-size: .75rem;
      line-height: 1.5;
    }
    .btn-reload {
      display: block;
      width: 100%;
      background: #fff;
      color: #6d28d9;
      font-family: inherit;
      font-size: 1rem;
      font-weight: 700;
      padding: 1rem 1.5rem;
      border: none;
      border-radius: 1rem;
      cursor: pointer;
      margin-bottom: .75rem;
      transition: opacity .15s;
    }
    .btn-reload:hover { opacity: .9; }
    .btn-reload:active { opacity: .8; }
    .link-home {
      display: block;
      color: rgba(255,255,255,.5);
      font-size: .875rem;
      text-decoration: none;
      transition: color .15s;
    }
    .link-home:hover { color: rgba(255,255,255,.85); }
  </style>
</head>

<body>
  <div class="card">

    <div class="icon" role="img" aria-label="Немає з'єднання">📡</div>

    <h1>Немає інтернету</h1>
    <p class="subtitle">
      Перевір підключення до мережі<br>і спробуй ще раз.
    </p>

    <!-- Якщо учень був на олімпіаді — нагадуємо про backup -->
    <div id="backup-hint" class="backup-hint">
      <p class="backup-hint__title">⚠️ Ти проходив олімпіаду?</p>
      <p class="backup-hint__desc">
        Твій прогрес збережено локально. Повернись на сторінку учня —
        коли з'явиться інтернет, результат відновиться автоматично.
      </p>
    </div>

    <button onclick="tryReload()" class="btn-reload">
      Спробувати знову
    </button>

    <a href="/" class="link-home">← На головну</a>

  </div>

  <script>
    // Перевіряємо чи є збережений backup олімпіади — якщо є, показуємо підказку
    (function checkBackup() {
      try {
        const raw = localStorage.getItem('rozumko_quiz_backup');
        if (!raw) return;
        const backup = JSON.parse(raw);
        // Backup вважається актуальним якщо йому менше 3 годин
        if (backup?.startedAt && Date.now() - backup.startedAt < 3 * 60 * 60 * 1000) {
          document.getElementById('backup-hint').style.display = 'block';
        }
      } catch { /* ігноруємо помилки localStorage */ }
    })();

    function tryReload() {
      window.location.reload();
    }
  </script>
</body>

</html>
