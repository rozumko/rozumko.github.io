<svg viewBox="0 0 800 240" role="img" aria-labelledby="svg-title-anim svg-desc-anim" style="display:block;width:100%;height:auto;max-width:800px;margin:18px auto;" xmlns="http://www.w3.org/2000/svg">
      <title id="svg-title-anim">Будова анімаційного циклу та вплив timing на плавність</title>
      <desc id="svg-desc-anim">Ліворуч цикл «повторити 10 разів» із блоками руху, зміни костюма й паузи. Праворуч три варіанти паузи: без паузи — надто швидко, 1.5 секунди — надто повільно, а 0.1, 0.3 чи 0.7 секунди варто спробувати й обрати ту, що підходить персонажу.</desc>
      
      <!-- Box 1: Animation Loop Structure -->
      <rect x="20" y="20" width="360" height="200" rx="10" fill="#F0F4F8" stroke="#0033A0" stroke-width="2"/>
      <rect x="20" y="20" width="360" height="36" rx="10" fill="#0033A0"/>
      <text x="200" y="44" font-family="sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Цикл анімації (Animation Loop)</text>

      <path d="M 40 68 L 340 68 L 340 90 L 70 90 L 70 170 L 340 170 L 340 192 L 40 192 Z" fill="#FFAB19" stroke="#E68A00" stroke-width="1.5"/>
      <text x="140" y="84" font-family="sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF">повторити 10 разів (repeat)</text>
      
      <rect x="80" y="98" width="245" height="22" rx="4" fill="#4C97FF"/>
      <text x="202" y="113" font-family="sans-serif" font-size="11" fill="#FFFFFF" text-anchor="middle">перемістити на 10 кроків (movement)</text>

      <rect x="80" y="123" width="245" height="22" rx="4" fill="#9966FF"/>
      <text x="202" y="138" font-family="sans-serif" font-size="11" fill="#FFFFFF" text-anchor="middle">наступний образ (costume)</text>

      <rect x="80" y="148" width="245" height="22" rx="4" fill="#FFAB19"/>
      <text x="202" y="163" font-family="sans-serif" font-size="11" fill="#FFFFFF" text-anchor="middle">чекати 0.2 секунд (timing)</text>

      <!-- Arrow -->
      <path d="M 390 120 L 420 120" stroke="#0033A0" stroke-width="3" fill="none"/>
      <polygon points="420,115 430,120 420,125" fill="#0033A0"/>

      <!-- Box 2: Timing Options -->
      <rect x="440" y="20" width="340" height="200" rx="10" fill="#FFFFFF" stroke="#D9E2F0" stroke-width="2"/>
      <rect x="440" y="20" width="340" height="36" rx="10" fill="#0033A0"/>
      <text x="610" y="44" font-family="sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Порівняння темпу (Timing)</text>

      <rect x="460" y="68" width="300" height="38" rx="6" fill="#FFF5F5" stroke="#FEB2B2"/>
      <text x="475" y="86" font-family="sans-serif" font-size="12" font-weight="bold" fill="#C53030">⚡ Без чекати (0 сек):</text>
      <text x="475" y="100" font-family="sans-serif" font-size="11" fill="#52606D">Too fast (занадто швидко / миготить)</text>

      <rect x="460" y="114" width="300" height="38" rx="6" fill="#FFF9DB" stroke="#FFD700"/>
      <text x="475" y="132" font-family="sans-serif" font-size="12" font-weight="bold" fill="#D97706">🐢 Чекати 1.5 сек:</text>
      <text x="475" y="146" font-family="sans-serif" font-size="11" fill="#52606D">Too slow (занадто повільно / робить паузи)</text>

      <rect x="460" y="160" width="300" height="42" rx="6" fill="#F0F4F8" stroke="#0033A0"/>
      <text x="475" y="178" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0033A0">🔬 Чекати 0.1 / 0.3 / 0.7 сек:</text>
      <text x="475" y="194" font-family="sans-serif" font-size="11" font-weight="bold" fill="#2F855A">Спробуй — що підходить твоєму персонажу?</text>
    </svg>
