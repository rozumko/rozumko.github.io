<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220" role="img" aria-labelledby="svg-title-files svg-desc-files">
      <title id="svg-title-files">Шлях створення та впорядкування файла у папку</title>
      <desc id="svg-desc-files">Схема показує послідовність дій від створення файла до збереження у папку.</desc>
      <rect x="20" y="30" width="220" height="160" rx="10" fill="#FFFFFF" stroke="#D9E2F0" stroke-width="2"/>
      <rect x="20" y="30" width="220" height="36" rx="10" fill="#0033A0"/>
      <text x="130" y="53" font-family="sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1. Новий файл (Create)</text>
      <text x="130" y="95" font-family="sans-serif" font-size="32" text-anchor="middle">📄</text>
      <text x="130" y="135" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0033A0" text-anchor="middle">Без_назви.txt</text>
      <text x="130" y="155" font-family="sans-serif" font-size="12" fill="#52606D" text-anchor="middle">.txt = розширення</text>
      <path d="M 250 110 L 280 110" stroke="#0033A0" stroke-width="3" fill="none"/>
      <polygon points="280,105 290,110 280,115" fill="#0033A0"/>
      <rect x="300" y="30" width="220" height="160" rx="10" fill="#F0F4F8" stroke="#0033A0" stroke-width="2"/>
      <rect x="300" y="30" width="220" height="36" rx="10" fill="#0033A0"/>
      <text x="410" y="53" font-family="sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2. Перейменування (Rename)</text>
      <text x="410" y="95" font-family="sans-serif" font-size="32" text-anchor="middle">✏️</text>
      <text x="410" y="135" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0033A0" text-anchor="middle">Казка_2клас.txt</text>
      <text x="410" y="155" font-family="sans-serif" font-size="12" fill="#52606D" text-anchor="middle">Змістовна назва</text>
      <path d="M 530 110 L 560 110" stroke="#0033A0" stroke-width="3" fill="none"/>
      <polygon points="560,105 570,110 560,115" fill="#0033A0"/>
      <rect x="580" y="30" width="200" height="160" rx="10" fill="#FFF9DB" stroke="#FFD700" stroke-width="2"/>
      <rect x="580" y="30" width="200" height="36" rx="10" fill="#FFD700"/>
      <text x="680" y="53" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1A1A1A" text-anchor="middle">3. Папка (Move)</text>
      <text x="680" y="95" font-family="sans-serif" font-size="32" text-anchor="middle">📁</text>
      <text x="680" y="135" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0033A0" text-anchor="middle">Папка: Мої_Тексти</text>
      <text x="680" y="155" font-family="sans-serif" font-size="12" fill="#52606D" text-anchor="middle">Надійне місце</text>
    </svg>
