<svg viewBox="0 0 800 240" role="img" aria-labelledby="svg-title-story svg-desc-story" xmlns="http://www.w3.org/2000/svg" width="800" height="240">
      <title id="svg-title-story">Чотири кроки створення цифрової історії</title>
      <desc id="svg-desc-story">Чотири кроки поспіль: планую, створюю, перевіряю за чеклістом і показую свою історію.</desc>
      
      <!-- Box 1: Plan & Template -->
      <rect x="15" y="30" width="175" height="180" rx="10" fill="#FFFFFF" stroke="#D9E2F0" stroke-width="2"/>
      <rect x="15" y="30" width="175" height="36" rx="10" fill="#0033A0"/>
      <text x="102" y="53" font-family="sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1. Планую 📝</text>
      <text x="102" y="95" font-family="sans-serif" font-size="28" text-anchor="middle">💡 🎯</text>
      <text x="102" y="135" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0033A0" text-anchor="middle">Вибір шаблону</text>
      <text x="102" y="158" font-family="sans-serif" font-size="11" fill="#52606D" text-anchor="middle">Мета й аудиторія</text>

      <!-- Arrow 1 -->
      <path d="M 198 120 L 212 120" stroke="#0033A0" stroke-width="2.5" fill="none"/>
      <polygon points="212,115 220,120 212,125" fill="#0033A0"/>

      <!-- Box 2: Create MVP -->
      <rect x="228" y="30" width="175" height="180" rx="10" fill="#F0F4F8" stroke="#0033A0" stroke-width="2"/>
      <rect x="228" y="30" width="175" height="36" rx="10" fill="#0033A0"/>
      <text x="315" y="53" font-family="sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2. Створюю 🛠️</text>
      <text x="315" y="95" font-family="sans-serif" font-size="26" text-anchor="middle">🖼️ 👾 🔊</text>
      <text x="315" y="135" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0033A0" text-anchor="middle">Код + Медіа + Дизайн</text>
      <text x="315" y="158" font-family="sans-serif" font-size="11" fill="#52606D" text-anchor="middle">Заголовок і рух</text>

      <!-- Arrow 2 -->
      <path d="M 411 120 L 425 120" stroke="#0033A0" stroke-width="2.5" fill="none"/>
      <polygon points="425,115 433,120 425,125" fill="#0033A0"/>

      <!-- Box 3: Test & Debug -->
      <rect x="441" y="30" width="175" height="180" rx="10" fill="#FFFFFF" stroke="#D9E2F0" stroke-width="2"/>
      <rect x="441" y="30" width="175" height="36" rx="10" fill="#0033A0"/>
      <text x="528" y="53" font-family="sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3. Перевіряю 🔍</text>
      <text x="528" y="95" font-family="sans-serif" font-size="28" text-anchor="middle">☑️ 🐛</text>
      <text x="528" y="135" font-family="sans-serif" font-size="12" font-weight="bold" fill="#C53030" text-anchor="middle">Екранний чекліст</text>
      <text x="528" y="158" font-family="sans-serif" font-size="11" fill="#52606D" text-anchor="middle">Виправлення помилок</text>

      <!-- Arrow 3 -->
      <path d="M 624 120 L 638 120" stroke="#0033A0" stroke-width="2.5" fill="none"/>
      <polygon points="638,115 646,120 638,125" fill="#0033A0"/>

      <!-- Box 4: Present -->
      <rect x="654" y="30" width="131" height="180" rx="10" fill="#FFF9DB" stroke="#FFD700" stroke-width="2"/>
      <rect x="654" y="30" width="131" height="36" rx="10" fill="#FFD700"/>
      <text x="719" y="53" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1A1A1A" text-anchor="middle">4. Показую 🗣️</text>
      <text x="719" y="95" font-family="sans-serif" font-size="26" text-anchor="middle">🌟 👏</text>
      <text x="719" y="135" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0033A0" text-anchor="middle">Презентація</text>
      <text x="719" y="158" font-family="sans-serif" font-size="11" fill="#52606D" text-anchor="middle">I created... I tested...</text>
    </svg>
