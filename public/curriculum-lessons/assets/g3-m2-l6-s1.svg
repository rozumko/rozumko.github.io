<svg viewBox="0 0 860 240" role="img" aria-labelledby="g3u6a-t g3u6a-d" xmlns="http://www.w3.org/2000/svg" width="860" height="240">
    <title id="g3u6a-t">Гіперпосилання і QR-код</title>
    <desc id="g3u6a-d">Ліворуч гіперпосилання: це може бути підкреслений текст, кнопка або картинка, яку натискають. Праворуч QR-код: камера зчитує його, пристрій показує адресу й питає, чи відкрити її. Спершу читаєш адресу, потім вирішуєш.</desc>
