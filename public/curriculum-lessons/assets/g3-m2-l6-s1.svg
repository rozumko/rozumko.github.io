    <text x="125" y="134" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF" font-family="Arial, sans-serif">Відкрити гру</text>
    <rect x="240" y="104" width="150" height="48" rx="8" fill="#FFFFFF" stroke="#0033A0" stroke-width="2"/>
    <text x="315" y="136" text-anchor="middle" font-size="24" font-family="Arial, sans-serif">🖼️ 🐬</text>
    <text x="215" y="190" text-anchor="middle" font-size="15" fill="#3D4757" font-family="Arial, sans-serif">текст, кнопка чи картинка — натискаєш</text>

    <rect x="442" y="14" width="412" height="200" rx="12" fill="#FFF9DB" stroke="#B38600" stroke-width="2"/>
