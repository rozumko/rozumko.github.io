<svg viewBox="0 0 860 170" role="img" aria-labelledby="g3u3b-t g3u3b-d" style="display:block;width:100%;height:auto;margin:16px 0;" xmlns="http://www.w3.org/2000/svg">
    <title id="g3u3b-t">Шлях запиту від твого пристрою до сервера компанії</title>
    <desc id="g3u3b-d">Ти набираєш запит на своєму пристрої. Далі він іде через інтернет на сервер компанії, яка створила чат-бот. Саме там текст опрацьовується, і саме там діють правила цієї компанії, а не твої.</desc>
