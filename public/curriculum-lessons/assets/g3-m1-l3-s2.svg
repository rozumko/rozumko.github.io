    <text x="129" y="98" text-anchor="middle" font-size="17" font-weight="700" fill="#155C32" font-family="Arial, sans-serif">Ти набираєш запит</text>
    <text x="129" y="126" text-anchor="middle" font-size="15" fill="#3D4757" font-family="Arial, sans-serif">тут правила твої</text>
