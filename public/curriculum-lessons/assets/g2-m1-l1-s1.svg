<svg viewBox="0 0 660 210" role="img" aria-labelledby="g2u1-t g2u1-d" xmlns="http://www.w3.org/2000/svg" width="660" height="210">
    <title id="g2u1-t">Три кроки системи: вхід, опрацювання, вихід</title>
    <desc id="g2u1-d">Натиснута клавіша А подає сигнал на вхід. Процесор разом із програмою опрацьовує команду. На виході на екрані з'являється літера А.</desc>

    <rect x="6" y="46" width="188" height="104" rx="10" fill="#EAF0FC" stroke="#0033A0" stroke-width="2"/>
    <text x="100" y="80" text-anchor="middle" font-size="17" font-weight="700" fill="#0033A0" font-family="Arial, sans-serif">1. ВХІД • Input</text>
    <text x="100" y="108" text-anchor="middle" font-size="26" font-family="Arial, sans-serif">⌨️</text>
    <text x="100" y="134" text-anchor="middle" font-size="15" fill="#3D4757" font-family="Arial, sans-serif">натискаю клавішу А</text>

    <path d="M198 98 H228" fill="none" stroke="#0033A0" stroke-width="3"/>
    <polygon points="228,90 240,98 228,106" fill="#0033A0"/>

    <rect x="244" y="46" width="188" height="104" rx="10" fill="#0033A0"/>
    <text x="338" y="80" text-anchor="middle" font-size="17" font-weight="700" fill="#FFFFFF" font-family="Arial, sans-serif">2. ОПРАЦЮВАННЯ</text>
    <text x="338" y="108" text-anchor="middle" font-size="26" font-family="Arial, sans-serif">🧠</text>
    <text x="338" y="134" text-anchor="middle" font-size="15" fill="#D6E0F5" font-family="Arial, sans-serif">програма впізнає А</text>

    <path d="M436 98 H466" fill="none" stroke="#0033A0" stroke-width="3"/>
    <polygon points="466,90 478,98 466,106" fill="#0033A0"/>

    <rect x="482" y="46" width="172" height="104" rx="10" fill="#FFF9DB" stroke="#B38600" stroke-width="2"/>
    <text x="568" y="80" text-anchor="middle" font-size="17" font-weight="700" fill="#7A5A00" font-family="Arial, sans-serif">3. ВИХІД • Output</text>
    <text x="568" y="108" text-anchor="middle" font-size="26" font-family="Arial, sans-serif">🖥️</text>
    <text x="568" y="134" text-anchor="middle" font-size="15" fill="#3D4757" font-family="Arial, sans-serif">на екрані літера А</text>

    <text x="330" y="184" text-anchor="middle" font-size="16" fill="#3D4757" font-family="Arial, sans-serif">Це правило працює в кожній системі — від мікрохвильовки до планшета.</text>
  </svg>
