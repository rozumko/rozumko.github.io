<svg viewBox="0 0 600 220" role="img" aria-labelledby="svg-title svg-desc" xmlns="http://www.w3.org/2000/svg" width="600" height="220">
        <title id="svg-title">Схема роботи зі звуком у ScratchJr</title>
        <desc id="svg-desc">Ця схема показує процес: запис через мікрофон, створення зеленого блоку звуку у скрипті та відтворення через динамік на локальному пристрої.</desc>
        <!-- Background -->
        <rect width="600" height="220" rx="8" fill="#FAFAFA"/>

        <!-- Input: Microphone -->
        <g transform="translate(15, 20)">
          <rect width="165" height="180" rx="8" fill="#F0F4F8" stroke="#0033A0" stroke-width="2"/>
          <text x="82" y="30" font-size="12" font-family="sans-serif" font-weight="bold" fill="#0033A0" text-anchor="middle">1. Введення (Input)</text>
          <text x="82" y="65" font-size="28" text-anchor="middle">🎙️</text>
          <text x="82" y="95" font-size="12" font-family="sans-serif" font-weight="bold" fill="#1A1A1A" text-anchor="middle">Мікрофон (Microphone)</text>
          <text x="82" y="115" font-size="12" font-family="sans-serif" fill="#555555" text-anchor="middle">Запис голосу (Record)</text>
          <text x="82" y="135" font-size="12" font-family="sans-serif" fill="#2E7D32" font-weight="bold" text-anchor="middle">🔒 Локально на пристрої</text>
        </g>

        <!-- Arrow 1 -->
        <path d="M 190 110 L 210 110" stroke="#FFD700" stroke-width="3" fill="none"/>

        <!-- Process: Sound Block -->
        <g transform="translate(215, 20)">
          <rect width="180" height="180" rx="8" fill="#E8F5E9" stroke="#C8E6C9" stroke-width="2"/>
          <text x="90" y="30" font-size="12" font-family="sans-serif" font-weight="bold" fill="#2E7D32" text-anchor="middle">2. Блок у скрипті</text>
          <!-- Green Sound Block visual -->
          <rect x="25" y="55" width="130" height="45" rx="6" fill="#4CAF50"/>
          <text x="90" y="82" font-size="13" font-family="sans-serif" font-weight="bold" fill="#ffffff" text-anchor="middle">🔊 Sound 1</text>
          <text x="90" y="125" font-size="12" font-family="sans-serif" fill="#1A1A1A" text-anchor="middle">Зелений блок коду</text>
          <text x="90" y="145" font-size="12" font-family="sans-serif" fill="#2E7D32" font-weight="bold" text-anchor="middle">Sound Block</text>
        </g>

        <!-- Arrow 2 -->
        <path d="M 400 110 L 420 110" stroke="#FFD700" stroke-width="3" fill="none"/>

        <!-- Output: Speaker -->
        <g transform="translate(425, 20)">
          <rect width="160" height="180" rx="8" fill="#FFFDF0" stroke="#FFE0A3" stroke-width="2"/>
          <text x="80" y="30" font-size="12" font-family="sans-serif" font-weight="bold" fill="#B38600" text-anchor="middle">3. Виведення (Output)</text>
          <text x="80" y="65" font-size="28" text-anchor="middle">🔊</text>
          <text x="80" y="95" font-size="12" font-family="sans-serif" font-weight="bold" fill="#1A1A1A" text-anchor="middle">Динамік (Speaker)</text>
          <text x="80" y="115" font-size="12" font-family="sans-serif" fill="#555555" text-anchor="middle">Відтворення (Play)</text>
        </g>
      </svg>
