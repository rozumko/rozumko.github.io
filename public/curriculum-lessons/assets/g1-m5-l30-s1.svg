<svg viewBox="0 0 600 240" role="img" aria-labelledby="svg-title svg-desc" style="display:block; width:100%; height:auto; max-width:600px; margin:16px auto;" xmlns="http://www.w3.org/2000/svg">
        <title id="svg-title">Схема маршруту руху персонажа від початкової позиції до цілі</title>
        <desc id="svg-desc">Ця схема показує сітку із початковою позицією Start, послідовністю окремих блоків руху вправо та вгору і кінцевою ціллю Finish.</desc>
        <!-- Background Grid -->
        <rect width="600" height="240" rx="8" fill="#FAFAFA"/>

        <!-- Grid Lines -->
        <path d="M 50 40 L 550 40 M 50 90 L 550 90 M 50 140 L 550 140 M 50 190 L 550 190" stroke="#E0E0E0" stroke-width="1" stroke-dasharray="4"/>
        <path d="M 100 20 L 100 210 M 200 20 L 200 210 M 300 20 L 300 210 M 400 20 L 400 210 M 500 20 L 500 210" stroke="#E0E0E0" stroke-width="1" stroke-dasharray="4"/>

        <!-- Start Position (Cat) -->
        <g transform="translate(100, 140)">
          <circle cx="0" cy="0" r="24" fill="#0033A0"/>
          <text x="0" y="6" font-size="16" font-family="sans-serif" fill="#ffffff" font-weight="bold" text-anchor="middle">🐱</text>
          <rect x="-35" y="30" width="70" height="22" rx="4" fill="#0033A0"/>
          <text x="0" y="45" font-size="12" font-family="sans-serif" font-weight="bold" fill="#ffffff" text-anchor="middle">START</text>
        </g>

        <!-- Movement Route Path -->
        <path d="M 100 140 L 400 140 L 400 40" stroke="#FFD700" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

        <!-- Code Blocks Representation on Path -->
        <g transform="translate(250, 115)">
          <rect x="-60" y="-14" width="120" height="28" rx="4" fill="#0033A0"/>
          <text x="0" y="4" font-size="12" font-family="sans-serif" font-weight="bold" fill="#ffffff" text-anchor="middle">➔ ➔ ➔</text>
        </g>

        <g transform="translate(435, 90)">
          <rect x="-50" y="-14" width="100" height="28" rx="4" fill="#0033A0"/>
          <text x="0" y="4" font-size="12" font-family="sans-serif" font-weight="bold" fill="#ffffff" text-anchor="middle">⬆ ⬆</text>
        </g>

        <!-- Finish Position (Star) -->
        <g transform="translate(400, 40)">
          <circle cx="0" cy="0" r="24" fill="#FFD700" stroke="#B38600" stroke-width="2"/>
          <text x="0" y="7" font-size="20" text-anchor="middle">⭐</text>
          <rect x="30" y="-11" width="70" height="22" rx="4" fill="#2E7D32"/>
          <text x="65" y="4" font-size="12" font-family="sans-serif" font-weight="bold" fill="#ffffff" text-anchor="middle">FINISH</text>
        </g>
      </svg>
