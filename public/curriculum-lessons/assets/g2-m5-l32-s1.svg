<svg viewBox="0 0 800 240" role="img" aria-labelledby="svg-title-dialog svg-desc-dialog" style="display:block;width:100%;height:auto;max-width:800px;margin:18px auto;" xmlns="http://www.w3.org/2000/svg">
      <title id="svg-title-dialog">Схема координації діалогу між двома спрайтами за допомогою блоку wait</title>
      <desc id="svg-desc-dialog">Схема демонструє запуск події, репліку й звук першого спрайта та очікування й відповідь другого спрайта.</desc>
      
      <!-- Box 1: Event Input -->
      <rect x="20" y="30" width="220" height="180" rx="10" fill="#FFFFFF" stroke="#D9E2F0" stroke-width="2"/>
      <rect x="20" y="30" width="220" height="36" rx="10" fill="#0033A0"/>
      <text x="130" y="53" font-family="sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1. Подія (Event)</text>
      <rect x="35" y="85" width="190" height="30" rx="6" fill="#FFD700"/>
      <text x="130" y="105" font-family="sans-serif" font-size="11" font-weight="bold" fill="#1A1A1A" text-anchor="middle">коли 🚩 натиснуто / click</text>
      <text x="130" y="145" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0033A0" text-anchor="middle">Запуск двох скриптів</text>
      <text x="130" y="168" font-family="sans-serif" font-size="12" fill="#52606D" text-anchor="middle">Одночасний старт</text>

      <!-- Arrow 1 -->
      <path d="M 240 120 L 260 120" stroke="#0033A0" stroke-width="3" fill="none"/>
      <polygon points="260,115 270,120 260,125" fill="#0033A0"/>

      <!-- Box 2: Sprite 1 -->
      <rect x="280" y="30" width="230" height="180" rx="10" fill="#F0F4F8" stroke="#0033A0" stroke-width="2"/>
      <rect x="280" y="30" width="230" height="36" rx="10" fill="#0033A0"/>
      <text x="395" y="53" font-family="sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2. Спрайт 1 (Перший)</text>
      <text x="395" y="85" font-family="sans-serif" font-size="12" fill="#1A1A1A" text-anchor="middle">💬 говорити "Привіт!" 2 сек (Say)</text>
      <text x="395" y="110" font-family="sans-serif" font-size="12" fill="#1A1A1A" text-anchor="middle">🔊 грати звук Meow (Sound)</text>
      <text x="395" y="150" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0033A0" text-anchor="middle">Перша репліка</text>
      <text x="395" y="172" font-family="sans-serif" font-size="12" fill="#2F855A" text-anchor="middle">Тривалість: 2 секунди</text>

      <!-- Arrow 2 -->
      <path d="M 510 120 L 530 120" stroke="#0033A0" stroke-width="3" fill="none"/>
      <polygon points="530,115 540,120 530,125" fill="#0033A0"/>

      <!-- Box 3: Sprite 2 -->
      <rect x="550" y="30" width="230" height="180" rx="10" fill="#FFF9DB" stroke="#FFD700" stroke-width="2"/>
      <rect x="550" y="30" width="230" height="36" rx="10" fill="#FFD700"/>
      <text x="665" y="53" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1A1A1A" text-anchor="middle">3. Спрайт 2 (Другий)</text>
      <text x="665" y="85" font-family="sans-serif" font-size="12" fill="#1A1A1A" text-anchor="middle">⏱️ чекати 2 секунди (Wait)</text>
      <text x="665" y="110" font-family="sans-serif" font-size="12" fill="#1A1A1A" text-anchor="middle">💬 говорити "Вітаю!" 2 сек (Respond)</text>
      <text x="665" y="150" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0033A0" text-anchor="middle">Відповідь</text>
      <text x="665" y="172" font-family="sans-serif" font-size="12" fill="#D97706" text-anchor="middle">Відповідь після паузи!</text>
    </svg>
