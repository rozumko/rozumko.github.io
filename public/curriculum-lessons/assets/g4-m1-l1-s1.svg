<svg viewBox="0 0 860 250" role="img" aria-labelledby="g4u1-t g4u1-d" xmlns="http://www.w3.org/2000/svg" width="860" height="250">
    <title id="g4u1-t">Три шари комп'ютерної системи</title>
    <desc id="g4u1-d">Найнижчий шар — апаратура: процесор, пам'ять, екран, клавіатура. Над ним системне програмне забезпечення, насамперед операційна система, яка керує апаратурою. Найвищий шар — прикладні програми, якими користується людина: Scratch, браузер, редактор тексту.</desc>

    <rect x="10" y="16" width="840" height="66" rx="10" fill="#EAF0FC" stroke="#0033A0" stroke-width="2"/>
    <text x="30" y="44" font-size="17" font-weight="700" fill="#0033A0" font-family="Arial, sans-serif">3. APPLICATION SOFTWARE — прикладні програми</text>
    <text x="30" y="68" font-size="15" fill="#3D4757" font-family="Arial, sans-serif">Scratch • браузер • редактор тексту • ігри. Ними користується людина.</text>

    <rect x="10" y="92" width="840" height="66" rx="10" fill="#0033A0"/>
    <text x="30" y="120" font-size="17" font-weight="700" fill="#FFFFFF" font-family="Arial, sans-serif">2. SYSTEM SOFTWARE — насамперед операційна система</text>
    <text x="30" y="144" font-size="15" fill="#D6E0F5" font-family="Arial, sans-serif">Windows • iPadOS • Android. Запускає програми, зберігає файли, керує пристроями.</text>

    <rect x="10" y="168" width="840" height="66" rx="10" fill="#FFF9DB" stroke="#B38600" stroke-width="2"/>
    <text x="30" y="196" font-size="17" font-weight="700" fill="#7A5A00" font-family="Arial, sans-serif">1. HARDWARE — апаратура</text>
    <text x="30" y="220" font-size="15" fill="#3D4757" font-family="Arial, sans-serif">Процесор • пам'ять • екран • клавіатура • диск.</text>
  </svg>
