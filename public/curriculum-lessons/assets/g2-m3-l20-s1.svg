<svg viewBox="0 0 800 240" role="img" aria-labelledby="svg-title-ai svg-desc-ai" style="display:block;width:100%;height:auto;max-width:800px;margin:18px auto;" xmlns="http://www.w3.org/2000/svg">
      <title id="svg-title-ai">Два набори прикладів для навчання ШІ</title>
      <desc id="svg-desc-ai">У першому наборі є п'ять квадратів і п'ять кругів — сортувальник має з чого вчитися, тож частіше відповідає правильно. У другому наборі десять квадратів і жодного круга — кругу сортувальнику визначити складно, і він може помилитися.</desc>
      
      <!-- Balanced Box -->
      <rect x="20" y="20" width="350" height="200" rx="10" fill="#F0F4F8" stroke="#0033A0" stroke-width="2"/>
      <rect x="20" y="20" width="350" height="40" rx="10" fill="#0033A0"/>
      <text x="195" y="45" font-family="sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Є приклади обох фігур</text>
      <text x="195" y="85" font-family="sans-serif" font-size="14" fill="#1A1A1A" text-anchor="middle">Приклади для навчання (Train):</text>
      <text x="195" y="110" font-family="sans-serif" font-size="14" fill="#0033A0" text-anchor="middle">5 Квадратів 🟩 + 5 Кругів 🔵</text>
      <path d="M 195 125 L 195 150" stroke="#0033A0" stroke-width="2"/>
      <rect x="85" y="155" width="220" height="45" rx="6" fill="#FFFFFF" stroke="#0033A0" stroke-width="1.5"/>
      <text x="195" y="182" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0033A0" text-anchor="middle">Частіше відповідає правильно</text>

      <!-- Unbalanced Box -->
      <rect x="430" y="20" width="350" height="200" rx="10" fill="#FFF5F5" stroke="#FEB2B2" stroke-width="2"/>
      <rect x="430" y="20" width="350" height="40" rx="10" fill="#C53030"/>
      <text x="605" y="45" font-family="sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Кругів у прикладах немає</text>
      <text x="605" y="85" font-family="sans-serif" font-size="14" fill="#1A1A1A" text-anchor="middle">Приклади для навчання (Train):</text>
      <text x="605" y="110" font-family="sans-serif" font-size="14" fill="#C53030" text-anchor="middle">10 Квадратів 🟩 + 0 Кругів ⚪</text>
      <path d="M 605 125 L 605 150" stroke="#C53030" stroke-width="2"/>
      <rect x="495" y="155" width="220" height="45" rx="6" fill="#FFFFFF" stroke="#C53030" stroke-width="1.5"/>
      <text x="605" y="182" font-family="sans-serif" font-size="13" font-weight="bold" fill="#C53030" text-anchor="middle">На кругах може помилятися</text>
    </svg>
