<svg viewBox="0 0 600 240" role="img" aria-labelledby="svg-title svg-desc" style="display:block; width:100%; height:auto; max-width:600px; margin:16px auto;" xmlns="http://www.w3.org/2000/svg">
        <title id="svg-title">Схема двох подій для одного персонажа у ScratchJr</title>
        <desc id="svg-desc">Ця схема показує одного персонажа Котика з двома різними скриптами: зелений прапорець запускає ходьбу вправо, а дотик пальчиком закликає стрибок вгору.</desc>
        <!-- Background -->
        <rect width="600" height="240" rx="8" fill="#FAFAFA"/>

        <!-- Central Character -->
        <g transform="translate(250, 70)">
          <circle cx="50" cy="40" r="30" fill="#0033A0"/>
          <text x="50" y="48" font-size="22" font-family="sans-serif" fill="#ffffff" text-anchor="middle">🐱</text>
          <text x="50" y="88" font-size="12" font-family="sans-serif" font-weight="bold" fill="#0033A0" text-anchor="middle">Один персонаж</text>
        </g>

        <!-- Event 1: Green Flag -->
        <g transform="translate(15, 20)">
          <rect width="210" height="95" rx="6" fill="#F0F4F8" stroke="#0033A0" stroke-width="1.5"/>
          <text x="105" y="25" font-size="12" font-family="sans-serif" font-weight="bold" fill="#0033A0" text-anchor="middle">Подія 1: Green Flag 🚩</text>
          <rect x="15" y="40" width="180" height="40" rx="4" fill="#ffffff" stroke="#0033A0"/>
          <text x="105" y="65" font-size="12" font-family="sans-serif" fill="#1A1A1A" text-anchor="middle">🚩 Start ➔ Move Right</text>
          <text x="105" y="107" font-size="12" font-family="sans-serif" fill="#555555" text-anchor="middle">(Запуск за прапорцем)</text>
        </g>

        <!-- Event 2: Tap Character -->
        <g transform="translate(375, 20)">
          <rect width="210" height="95" rx="6" fill="#FFFDF0" stroke="#FFE0A3" stroke-width="1.5"/>
          <text x="105" y="25" font-size="12" font-family="sans-serif" font-weight="bold" fill="#B38600" text-anchor="middle">Подія 2: Tap 👆</text>
          <rect x="15" y="40" width="180" height="40" rx="4" fill="#ffffff" stroke="#B38600"/>
          <text x="105" y="65" font-size="12" font-family="sans-serif" fill="#1A1A1A" text-anchor="middle">👆 Tap ➔ Jump Up</text>
          <text x="105" y="107" font-size="12" font-family="sans-serif" fill="#555555" text-anchor="middle">(Реакція на дотик)</text>
        </g>

        <!-- Bottom interaction summary -->
        <g transform="translate(15, 165)">
          <rect width="570" height="75" rx="6" fill="#E8F5E9" stroke="#C8E6C9" stroke-width="1.5"/>
          <text x="285" y="30" font-size="12" font-family="sans-serif" font-weight="bold" fill="#2E7D32" text-anchor="middle">✨ Взаємодія (Interaction): Натисни й побачиш (Tap and See)</text>
          <text x="285" y="55" font-size="12" font-family="sans-serif" fill="#1A1A1A" text-anchor="middle">Котик вільно прогулюється, але підстрибує тільки тоді, коли торкаєшся його пальчиком!</text>
        </g>
      </svg>
