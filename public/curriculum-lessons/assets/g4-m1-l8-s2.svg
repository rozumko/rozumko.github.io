<svg viewBox="0 0 860 250" role="img" aria-labelledby="g4u8b-t g4u8b-d" style="display:block;width:100%;height:auto;margin:16px 0;" xmlns="http://www.w3.org/2000/svg">
    <title id="g4u8b-t">Таблиця шифру Цезаря з ключем 3</title>
    <desc id="g4u8b-d">Два блоки по тринадцять літер. Верхній рядок кожного блоку — звичайна літера, нижній — шифрована, зсунута на три кроки вперед. A стає D, B стає E, C стає F і так далі. Наприкінці алфавіту відлік іде з початку: X стає A, Y стає B, Z стає C.</desc>
