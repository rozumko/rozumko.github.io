<svg viewBox="0 0 800 220" role="img" aria-labelledby="svg-title-prompt svg-desc-prompt" xmlns="http://www.w3.org/2000/svg" width="800" height="220">
      <title id="svg-title-prompt">Порівняння розмитого та конкретного промпту</title>
      <desc id="svg-desc-prompt">Розмитий промпт «Намалюй кота» дає кота будь-якого вигляду. Чіткий промпт «Намалюй рудого кота у космосі» дає результат, ближчий до твого задуму. Перевірити його все одно треба.</desc>
      
      <!-- Box 1: Vague Prompt -->
      <rect x="20" y="20" width="350" height="180" rx="10" fill="#FFFFFF" stroke="#D9E2F0" stroke-width="2"/>
      <rect x="20" y="20" width="350" height="40" rx="10" fill="#E2E8F0"/>
      <text x="195" y="45" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1A1A1A" text-anchor="middle">🌫️ Розмитий промпт</text>
      <text x="195" y="85" font-family="sans-serif" font-size="14" fill="#C53030" font-weight="bold" text-anchor="middle">«Намалюй кота»</text>
      <path d="M 195 100 L 195 125" stroke="#D9E2F0" stroke-width="2"/>
      <rect x="85" y="130" width="220" height="45" rx="6" fill="#FAFAFA" stroke="#D9E2F0" stroke-width="1.5"/>
      <text x="195" y="157" font-family="sans-serif" font-size="13" fill="#52606D" text-anchor="middle">Кіт — який завгодно</text>

      <!-- Box 2: Specific Prompt -->
      <rect x="430" y="20" width="350" height="180" rx="10" fill="#F0F4F8" stroke="#0033A0" stroke-width="2"/>
      <rect x="430" y="20" width="350" height="40" rx="10" fill="#0033A0"/>
      <text x="605" y="45" font-family="sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">🎯 Чіткий промпт</text>
      <text x="605" y="92" font-family="sans-serif" font-size="14" fill="#0033A0" font-weight="bold" text-anchor="middle">«Намалюй рудого кота у космосі»</text>
      <path d="M 605 108 L 605 128" stroke="#0033A0" stroke-width="2"/>
      <rect x="495" y="130" width="220" height="45" rx="6" fill="#FFFFFF" stroke="#0033A0" stroke-width="1.5"/>
      <text x="605" y="157" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0033A0" text-anchor="middle">Ближче до твого задуму</text>
    </svg>
