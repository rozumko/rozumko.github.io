<svg viewBox="0 0 600 240" role="img" aria-labelledby="svg-title svg-desc" xmlns="http://www.w3.org/2000/svg" width="600" height="240">
        <title id="svg-title">Схема створення сцени у ScratchJr</title>
        <desc id="svg-desc">Ця схема показує елементи сцени у ScratchJr: тло (background), додавання персонажів (characters) та збереження проєкту (save project).</desc>
        <!-- Background -->
        <rect width="600" height="240" rx="8" fill="#FAFAFA"/>

        <!-- Canvas Frame -->
        <g transform="translate(15, 15)">
          <rect width="360" height="210" rx="8" fill="#E8F5E9" stroke="#C8E6C9" stroke-width="2"/>
          <text x="180" y="25" font-size="12" font-family="sans-serif" font-weight="bold" fill="#2E7D32" text-anchor="middle">🖼️ Сцена (Scene) = Background + Characters</text>

          <!-- Background representation -->
          <rect x="15" y="35" width="330" height="120" rx="4" fill="#81D4FA" opacity="0.4"/>
          <circle cx="300" cy="65" r="18" fill="#FFD700"/>
          <path d="M 15 155 L 90 90 L 160 155 Z" fill="#A5D6A7"/>
          <path d="M 120 155 L 210 80 L 310 155 Z" fill="#81C784"/>
          <text x="180" y="105" font-size="12" font-family="sans-serif" font-weight="bold" fill="#0288D1" text-anchor="middle">Тло (Background)</text>

          <!-- Two characters -->
          <circle cx="80" cy="130" r="15" fill="#FF9800"/>
          <text x="80" y="134" font-size="12" font-family="sans-serif" fill="#ffffff" font-weight="bold" text-anchor="middle">🐱</text>
          <text x="80" y="155" font-size="12" font-family="sans-serif" fill="#1A1A1A" text-anchor="middle">Character 1</text>

          <circle cx="260" cy="130" r="15" fill="#E91E63"/>
          <text x="260" y="134" font-size="12" font-family="sans-serif" fill="#ffffff" font-weight="bold" text-anchor="middle">🐰</text>
          <text x="260" y="155" font-size="12" font-family="sans-serif" fill="#1A1A1A" text-anchor="middle">Character 2</text>
        </g>

        <!-- Right Tools Column -->
        <g transform="translate(390, 15)">
          <!-- Add/Delete -->
          <rect width="195" height="95" rx="6" fill="#F0F4F8" stroke="#0033A0" stroke-width="1.5"/>
          <text x="97" y="25" font-size="12" font-family="sans-serif" font-weight="bold" fill="#0033A0" text-anchor="middle">➕ Add / ❌ Delete</text>
          <text x="15" y="50" font-size="12" font-family="sans-serif" fill="#1A1A1A">• Add (+) — додати героїв</text>
          <text x="15" y="72" font-size="12" font-family="sans-serif" fill="#1A1A1A">• Delete (✕) — прибрати</text>

          <!-- Save / Open -->
          <g transform="translate(0, 110)">
            <rect width="195" height="100" rx="6" fill="#FFFDF0" stroke="#FFE0A3" stroke-width="1.5"/>
            <text x="97" y="25" font-size="12" font-family="sans-serif" font-weight="bold" fill="#B38600" text-anchor="middle">💾 Save &amp; Open</text>
            <text x="15" y="50" font-size="12" font-family="sans-serif" fill="#1A1A1A">• Save — зберегти проєкт</text>
            <text x="15" y="72" font-size="12" font-family="sans-serif" fill="#1A1A1A">• Open — відкрити знову</text>
          </g>
        </g>
      </svg>
