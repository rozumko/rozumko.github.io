<svg viewBox="0 0 700 170" role="img" aria-labelledby="g1u2b-t g1u2b-d" xmlns="http://www.w3.org/2000/svg" width="700" height="170">
    <title id="g1u2b-t">Що робити зі старим пристроєм</title>
    <desc id="g1u2b-d">Спершу пристрій ремонтують. Якщо він ще працює — віддають тому, кому потрібен. І лише зовсім зламаний несуть на переробку, де з нього дістають цінні матеріали.</desc>
