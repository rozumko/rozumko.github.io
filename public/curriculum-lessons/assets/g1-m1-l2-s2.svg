    <text x="110" y="72" text-anchor="middle" font-size="30" font-family="Arial, sans-serif">🔧</text>
    <text x="110" y="104" text-anchor="middle" font-size="18" font-weight="700" fill="#155C32" font-family="Arial, sans-serif">Полагодити</text>
    <text x="110" y="126" text-anchor="middle" font-size="15" fill="#3D4757" font-family="Arial, sans-serif">спершу до майстра</text>
