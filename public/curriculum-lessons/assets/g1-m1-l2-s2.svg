    <rect x="254" y="34" width="208" height="100" rx="12" fill="#EAF0FC" stroke="#0033A0" stroke-width="2"/>
    <text x="358" y="72" text-anchor="middle" font-size="30" font-family="Arial, sans-serif">🎁</text>
    <text x="358" y="104" text-anchor="middle" font-size="18" font-weight="700" fill="#0033A0" font-family="Arial, sans-serif">Віддати</text>
    <text x="358" y="126" text-anchor="middle" font-size="15" fill="#3D4757" font-family="Arial, sans-serif">якщо ще працює</text>
