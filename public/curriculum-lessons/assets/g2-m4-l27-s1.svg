<svg viewBox="0 0 800 240" role="img" aria-labelledby="svg-title-loop svg-desc-loop" style="display:block;width:100%;height:auto;max-width:800px;margin:18px auto;" xmlns="http://www.w3.org/2000/svg">
      <title id="svg-title-loop">Той самий рух без repeat і з repeat</title>
      <desc id="svg-desc-loop">Варіант А: чотири однакові блоки «перемістити на 20 кроків» один за одним. Варіант Б: один блок «повторити 4 рази» з одним блоком «перемістити на 20 кроків» усередині. Результат однаковий, але варіант Б записано коротше.</desc>
      
      <!-- Left Box: Long Script -->
      <rect x="20" y="20" width="350" height="200" rx="10" fill="#FFFFFF" stroke="#D9E2F0" stroke-width="2"/>
      <rect x="20" y="20" width="350" height="36" rx="10" fill="#E2E8F0"/>
      <text x="195" y="44" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1A1A1A" text-anchor="middle">Варіант А: без repeat</text>
      
      <rect x="50" y="65" width="290" height="24" rx="4" fill="#4C97FF"/>
      <text x="195" y="81" font-family="sans-serif" font-size="13" fill="#FFFFFF" text-anchor="middle">перемістити на 20 кроків</text>
      <rect x="50" y="93" width="290" height="24" rx="4" fill="#4C97FF"/>
      <text x="195" y="109" font-family="sans-serif" font-size="13" fill="#FFFFFF" text-anchor="middle">перемістити на 20 кроків</text>
      <rect x="50" y="121" width="290" height="24" rx="4" fill="#4C97FF"/>
      <text x="195" y="137" font-family="sans-serif" font-size="13" fill="#FFFFFF" text-anchor="middle">перемістити на 20 кроків</text>
      <rect x="50" y="149" width="290" height="24" rx="4" fill="#4C97FF"/>
      <text x="195" y="165" font-family="sans-serif" font-size="13" fill="#FFFFFF" text-anchor="middle">перемістити на 20 кроків</text>
      
      <text x="195" y="198" font-family="sans-serif" font-size="14" fill="#52606D" text-anchor="middle">4 блоки — працює правильно</text>

      <!-- Arrow -->
      <path d="M 380 120 L 410 120" stroke="#0033A0" stroke-width="3" fill="none"/>
      <polygon points="410,115 420,120 410,125" fill="#0033A0"/>

      <!-- Right Box: Repeat Loop -->
      <rect x="430" y="20" width="350" height="200" rx="10" fill="#F0F4F8" stroke="#0033A0" stroke-width="2"/>
      <rect x="430" y="20" width="350" height="36" rx="10" fill="#0033A0"/>
      <text x="605" y="44" font-family="sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Варіант Б: з repeat</text>

      <!-- Outer Repeat Block Frame -->
      <path d="M 460 65 L 750 65 L 750 90 L 490 90 L 490 135 L 750 135 L 750 160 L 460 160 Z" fill="#FFAB19" stroke="#E68A00" stroke-width="1.5"/>
      <text x="560" y="82" font-family="sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF">повторити 4 рази (times)</text>
      
      <!-- Inner Motion Block -->
      <rect x="495" y="98" width="245" height="30" rx="4" fill="#4C97FF"/>
      <text x="617" y="117" font-family="sans-serif" font-size="13" fill="#FFFFFF" text-anchor="middle">перемістити на 20 кроків</text>

      <text x="605" y="198" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0033A0" text-anchor="middle">Той самий результат — записано коротше</text>
    </svg>
