<svg viewBox="0 0 860 190" role="img" aria-labelledby="g4u8c-t g4u8c-d" style="display:block;width:100%;height:auto;margin:16px 0;" xmlns="http://www.w3.org/2000/svg">
      <title id="g4u8c-t">Легенда шифру Pigpen</title>
      <desc id="g4u8c-d">Перша сітка три на три містить літери від A до I без крапок. Друга така сама сітка — літери від J до R, у кожній клітинці крапка. Третя фігура — косий хрест із літерами S угорі, T ліворуч, U праворуч, V унизу. Четвертий косий хрест — літери W, X, Y, Z з крапками.</desc>
