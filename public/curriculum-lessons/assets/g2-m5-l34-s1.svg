<svg viewBox="0 0 800 240" role="img" aria-labelledby="svg-title-sm svg-desc-sm" style="display:block;width:100%;height:auto;max-width:800px;margin:18px auto;" xmlns="http://www.w3.org/2000/svg">
      <title id="svg-title-sm">Етапи створення Stop Motion анімації</title>
      <desc id="svg-desc-sm">Схема показує 4 етапи: фіксація камери та зйомка кадрів, послідовність фото, редагування й видалення невдалих кадрів, підсумкове відео зі швидкістю та титрами.</desc>
      
      <!-- Box 1: Stable Camera & Capture -->
      <rect x="15" y="30" width="175" height="180" rx="10" fill="#FFFFFF" stroke="#D9E2F0" stroke-width="2"/>
      <rect x="15" y="30" width="175" height="36" rx="10" fill="#0033A0"/>
      <text x="102" y="53" font-family="sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1. Capture 📸</text>
      <text x="102" y="95" font-family="sans-serif" font-size="28" text-anchor="middle">📱 📐</text>
      <text x="102" y="135" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0033A0" text-anchor="middle">Нерухома камера</text>
      <text x="102" y="158" font-family="sans-serif" font-size="11" fill="#52606D" text-anchor="middle">Маленький крок предмета</text>

      <!-- Arrow 1 -->
      <path d="M 198 120 L 212 120" stroke="#0033A0" stroke-width="2.5" fill="none"/>
      <polygon points="212,115 220,120 212,125" fill="#0033A0"/>

      <!-- Box 2: Sequence of Frames -->
      <rect x="228" y="30" width="175" height="180" rx="10" fill="#F0F4F8" stroke="#0033A0" stroke-width="2"/>
      <rect x="228" y="30" width="175" height="36" rx="10" fill="#0033A0"/>
      <text x="315" y="53" font-family="sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2. Sequence 🎞️</text>
      <text x="315" y="95" font-family="sans-serif" font-size="26" text-anchor="middle">🖼️ ➔ 🖼️ ➔ 🖼️</text>
      <text x="315" y="135" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0033A0" text-anchor="middle">Кадри (Frames)</text>
      <text x="315" y="158" font-family="sans-serif" font-size="11" fill="#52606D" text-anchor="middle">Впорядковані фото</text>

      <!-- Arrow 2 -->
      <path d="M 411 120 L 425 120" stroke="#0033A0" stroke-width="2.5" fill="none"/>
      <polygon points="425,115 433,120 425,125" fill="#0033A0"/>

      <!-- Box 3: Edit & Delete -->
      <rect x="441" y="30" width="175" height="180" rx="10" fill="#FFFFFF" stroke="#D9E2F0" stroke-width="2"/>
      <rect x="441" y="30" width="175" height="36" rx="10" fill="#0033A0"/>
      <text x="528" y="53" font-family="sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3. Preview &amp; Edit 👁️</text>
      <text x="528" y="95" font-family="sans-serif" font-size="28" text-anchor="middle">▶️ 🗑️</text>
      <text x="528" y="135" font-family="sans-serif" font-size="12" font-weight="bold" fill="#C53030" text-anchor="middle">Delete невдалий кадр</text>
      <text x="528" y="158" font-family="sans-serif" font-size="11" fill="#52606D" text-anchor="middle">Перевірка руху</text>

      <!-- Arrow 3 -->
      <path d="M 624 120 L 638 120" stroke="#0033A0" stroke-width="2.5" fill="none"/>
      <polygon points="638,115 646,120 638,125" fill="#0033A0"/>

      <!-- Box 4: Final Movie -->
      <rect x="654" y="30" width="131" height="180" rx="10" fill="#FFF9DB" stroke="#FFD700" stroke-width="2"/>
      <rect x="654" y="30" width="131" height="36" rx="10" fill="#FFD700"/>
      <text x="719" y="53" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1A1A1A" text-anchor="middle">4. Final Movie 🎬</text>
      <text x="719" y="95" font-family="sans-serif" font-size="26" text-anchor="middle">⚡ 📝</text>
      <text x="719" y="135" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0033A0" text-anchor="middle">Speed &amp; Title</text>
      <text x="719" y="158" font-family="sans-serif" font-size="11" fill="#52606D" text-anchor="middle">Готове відео!</text>
    </svg>
