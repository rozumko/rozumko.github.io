<svg viewBox="0 0 800 220" role="img" aria-labelledby="svg-title-search svg-desc-search" style="display:block;width:100%;height:auto;max-width:800px;margin:18px auto;" xmlns="http://www.w3.org/2000/svg">
      <title id="svg-title-search">Порівняння пошукової системи та штучного інтелекту</title>
      <desc id="svg-desc-search">Пошукова система часто показує список сайтів, наприклад «Сайт про тварин» і «Енциклопедія для дітей», — і видно, звідки інформація. Інструмент ШІ часто створює готову відповідь, наприклад про те, що білки їдять узимку. Цю відповідь треба перевірити.</desc>
      
      <!-- Left Box: Search Engine -->
      <rect x="20" y="20" width="350" height="180" rx="10" fill="#FFFFFF" stroke="#D9E2F0" stroke-width="2"/>
      <rect x="20" y="20" width="350" height="40" rx="10" fill="#0033A0"/>
      <text x="195" y="45" font-family="sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">🔍 Пошукова система</text>
      <text x="195" y="85" font-family="sans-serif" font-size="14" fill="#1A1A1A" text-anchor="middle">Часто показує: список посилань</text>
      <text x="195" y="115" font-family="sans-serif" font-size="15" fill="#0033A0" text-anchor="middle">🔗 Сайт про тварин</text>
      <text x="195" y="138" font-family="sans-serif" font-size="15" fill="#0033A0" text-anchor="middle">🔗 Енциклопедія для дітей</text>
      <text x="195" y="175" font-family="sans-serif" font-size="14" fill="#52606D" text-anchor="middle">Видно, звідки інформація</text>

      <!-- Right Box: AI Tool -->
      <rect x="430" y="20" width="350" height="180" rx="10" fill="#F0F4F8" stroke="#0033A0" stroke-width="2"/>
      <rect x="430" y="20" width="350" height="40" rx="10" fill="#0033A0"/>
      <text x="605" y="45" font-family="sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">🤖 Інструмент ШІ</text>
      <text x="605" y="85" font-family="sans-serif" font-size="14" fill="#1A1A1A" text-anchor="middle">Часто показує: готову відповідь</text>
      <rect x="450" y="100" width="310" height="50" rx="6" fill="#FFFFFF" stroke="#D9E2F0"/>
      <text x="605" y="121" font-family="sans-serif" font-size="14" fill="#1A1A1A" text-anchor="middle">«Білки взимку їдять горіхи</text>
      <text x="605" y="139" font-family="sans-serif" font-size="14" fill="#1A1A1A" text-anchor="middle">та шишки, заготовлені восени.»</text>
      <text x="605" y="175" font-family="sans-serif" font-size="14" fill="#C53030" text-anchor="middle">Звідки це? Перевір!</text>
    </svg>
