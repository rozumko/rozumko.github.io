<svg viewBox="0 0 860 240" role="img" aria-labelledby="g4u5a-t g4u5a-d" xmlns="http://www.w3.org/2000/svg" width="860" height="240">
    <title id="g4u5a-t">Як безкоштовна гра може заробляти</title>
    <desc id="g4u5a-d">Гравець грає безкоштовно, але дає сервісу свою увагу й дані про дії. Гра збирає ці дані й продає місце для реклами. Рекламодавці платять грі та показують гравцеві рекламу, дібрану під його інтереси. Стрілка від рекламодавців повертається до гравця.</desc>
    <rect x="6" y="20" width="250" height="120" rx="12" fill="#EAF0FC" stroke="#0033A0" stroke-width="2"/>
    <text x="131" y="58" text-anchor="middle" font-size="17" font-weight="700" fill="#0033A0" font-family="Arial, sans-serif">🎮 Гравець</text>
    <text x="131" y="90" text-anchor="middle" font-size="15" fill="#3D4757" font-family="Arial, sans-serif">грає безкоштовно,</text>
    <text x="131" y="112" text-anchor="middle" font-size="15" fill="#3D4757" font-family="Arial, sans-serif">дає увагу й дані</text>
    <path d="M260 80 H292" fill="none" stroke="#0033A0" stroke-width="3"/>
    <polygon points="292,72 305,80 292,88" fill="#0033A0"/>
    <rect x="308" y="20" width="244" height="120" rx="12" fill="#0033A0"/>
    <text x="430" y="58" text-anchor="middle" font-size="17" font-weight="700" fill="#FFFFFF" font-family="Arial, sans-serif">📱 «Безкоштовна» гра</text>
    <text x="430" y="90" text-anchor="middle" font-size="15" fill="#D6E0F5" font-family="Arial, sans-serif">збирає дані,</text>
    <text x="430" y="112" text-anchor="middle" font-size="15" fill="#D6E0F5" font-family="Arial, sans-serif">продає місце для реклами</text>
    <path d="M556 80 H588" fill="none" stroke="#0033A0" stroke-width="3"/>
    <polygon points="588,72 601,80 588,88" fill="#0033A0"/>
    <rect x="604" y="20" width="250" height="120" rx="12" fill="#FFF9DB" stroke="#B38600" stroke-width="2"/>
    <text x="729" y="58" text-anchor="middle" font-size="17" font-weight="700" fill="#7A5A00" font-family="Arial, sans-serif">📢 Рекламодавці</text>
    <text x="729" y="90" text-anchor="middle" font-size="15" fill="#3D4757" font-family="Arial, sans-serif">платять грі за</text>
    <text x="729" y="112" text-anchor="middle" font-size="15" fill="#3D4757" font-family="Arial, sans-serif">показ реклами</text>
    <path d="M729 144 V196 H131 V156" fill="none" stroke="#B38600" stroke-width="3" stroke-dasharray="8 6"/>
    <polygon points="123,158 131,144 139,158" fill="#B38600"/>
    <text x="430" y="226" text-anchor="middle" font-size="15" fill="#7A5A00" font-family="Arial, sans-serif">реклама, дібрана під інтереси гравця</text>
  </svg>
