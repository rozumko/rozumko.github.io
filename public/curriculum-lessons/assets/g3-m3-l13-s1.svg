<svg viewBox="0 0 860 250" role="img" aria-labelledby="g3u13a-t g3u13a-d" xmlns="http://www.w3.org/2000/svg" width="860" height="250">
    <title id="g3u13a-t">Сітка електронної таблиці з адресою комірки</title>
    <desc id="g3u13a-d">Таблиця зі стовпцями A, B, C і рядками 1, 2, 3. У рядку 1 заголовки: Персонаж, День, Сторінки. У рядку 2: Лисичка, Понеділок, 12. У рядку 3: Їжачок, Вівторок, 15. Комірку B2 виділено: це стовпець B і рядок 2.</desc>
    <rect x="80" y="14" width="620" height="36" fill="#F0F4F8" stroke="#D9E2F0"/>
    <text x="180" y="38" text-anchor="middle" font-size="16" font-weight="700" fill="#0033A0" font-family="Arial, sans-serif">A</text>
    <text x="390" y="38" text-anchor="middle" font-size="16" font-weight="700" fill="#0033A0" font-family="Arial, sans-serif">B</text>
    <text x="600" y="38" text-anchor="middle" font-size="16" font-weight="700" fill="#0033A0" font-family="Arial, sans-serif">C</text>
    <rect x="20" y="50" width="60" height="150" fill="#F0F4F8" stroke="#D9E2F0"/>
    <text x="50" y="80" text-anchor="middle" font-size="16" font-weight="700" fill="#0033A0" font-family="Arial, sans-serif">1</text>
    <text x="50" y="130" text-anchor="middle" font-size="16" font-weight="700" fill="#0033A0" font-family="Arial, sans-serif">2</text>
    <text x="50" y="180" text-anchor="middle" font-size="16" font-weight="700" fill="#0033A0" font-family="Arial, sans-serif">3</text>
    <rect x="80" y="50" width="620" height="50" fill="#FFF9DB" stroke="#D9E2F0"/>
    <rect x="80" y="100" width="620" height="50" fill="#FFFFFF" stroke="#D9E2F0"/>
    <rect x="80" y="150" width="620" height="50" fill="#FFFFFF" stroke="#D9E2F0"/>
    <path d="M290 50 V200 M500 50 V200" fill="none" stroke="#D9E2F0" stroke-width="1"/>
    <text x="100" y="80" font-size="16" font-weight="700" fill="#1A1A1A" font-family="Arial, sans-serif">Персонаж</text>
    <text x="310" y="80" font-size="16" font-weight="700" fill="#1A1A1A" font-family="Arial, sans-serif">День</text>
    <text x="520" y="80" font-size="16" font-weight="700" fill="#1A1A1A" font-family="Arial, sans-serif">Сторінки</text>
    <text x="100" y="130" font-size="16" fill="#1A1A1A" font-family="Arial, sans-serif">Лисичка</text>
    <rect x="292" y="102" width="206" height="46" fill="#EAF0FC" stroke="#0033A0" stroke-width="3"/>
    <text x="310" y="130" font-size="16" fill="#1A1A1A" font-family="Arial, sans-serif">Понеділок</text>
    <text x="520" y="130" font-size="16" fill="#1A1A1A" font-family="Arial, sans-serif">12</text>
    <text x="100" y="180" font-size="16" fill="#1A1A1A" font-family="Arial, sans-serif">Їжачок</text>
    <text x="310" y="180" font-size="16" fill="#1A1A1A" font-family="Arial, sans-serif">Вівторок</text>
    <text x="520" y="180" font-size="16" fill="#1A1A1A" font-family="Arial, sans-serif">15</text>
    <text x="720" y="118" font-size="16" font-weight="700" fill="#0033A0" font-family="Arial, sans-serif">B2 =</text>
    <text x="720" y="142" font-size="15" fill="#3D4757" font-family="Arial, sans-serif">стовпець B</text>
    <text x="720" y="164" font-size="15" fill="#3D4757" font-family="Arial, sans-serif">+ рядок 2</text>
    <text x="360" y="234" text-anchor="middle" font-size="15" fill="#3D4757" font-family="Arial, sans-serif">Жовтий рядок 1 — заголовки: вони пояснюють стовпці.</text>
  </svg>
