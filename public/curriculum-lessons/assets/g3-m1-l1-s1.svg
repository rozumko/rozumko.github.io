    <text x="578" y="70" text-anchor="middle" font-size="24" font-family="Arial, sans-serif">📶</text>
    <text x="578" y="97" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF" font-family="Arial, sans-serif">Network</text>
    <text x="578" y="119" text-anchor="middle" font-size="14" fill="#D6E0F5" font-family="Arial, sans-serif">Wi-Fi та інтернет</text>

