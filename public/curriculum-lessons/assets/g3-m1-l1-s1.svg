    <text x="795" y="119" text-anchor="middle" font-size="14" fill="#3D4757" font-family="Arial, sans-serif">відео з мережі</text>

    <text x="440" y="176" text-anchor="middle" font-size="15" fill="#3D4757" font-family="Arial, sans-serif">Розірветься будь-яка ланка — мультфільм не піде.</text>
