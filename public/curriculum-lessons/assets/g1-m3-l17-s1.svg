<svg viewBox="0 0 600 220" style="width: 100%; height: auto; display: block; margin: 0 auto; background: #FAFDFE;" aria-label="Схема роботи безпечної форми" xmlns="http://www.w3.org/2000/svg">
        <!-- Google Form Box -->
        <rect x="10" y="20" width="160" height="180" rx="10" fill="#ffffff" stroke="#9C27B0" stroke-width="2"/>
        <rect x="10" y="20" width="160" height="30" rx="10" fill="#9C27B0"/>
        <text x="90" y="40" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">Форма (Form)</text>

        <circle cx="30" cy="80" r="6" fill="none" stroke="#333333" stroke-width="2"/>
        <text x="45" y="84" font-size="12" fill="#333333">Зелений колір 🟢</text>
        <circle cx="30" cy="110" r="6" fill="#333333"/>
        <text x="45" y="114" font-size="12" fill="#333333">Твій телефон 📱</text>

        <rect x="25" y="145" width="130" height="25" rx="5" fill="#0033A0"/>
        <text x="90" y="161" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">Submit (Надіслати)</text>

        <!-- Arrow with safe data -->
        <path d="M 170 80 L 260 80" stroke="#2E7D32" stroke-width="3" fill="none" marker-end="url(#arrow-green)"/>
        <text x="215" y="70" fill="#2E7D32" font-size="12" font-weight="bold" text-anchor="middle">Безпечно! ✅</text>

        <!-- Arrow with unsafe data -->
        <path d="M 170 110 L 250 110" stroke="#D32F2F" stroke-width="3" fill="none"/>
        <text x="210" y="125" fill="#D32F2F" font-size="12" font-weight="bold" text-anchor="middle">СТОП! ❌</text>

        <!-- Shield (Privacy Protection) -->
        <path d="M 260 90 Q 285 70 310 90 Q 310 130 285 150 Q 260 130 260 90 Z" fill="#FFE0A3" stroke="#B38600" stroke-width="2"/>
        <text x="285" y="115" fill="#B38600" font-size="20" text-anchor="middle">🛡️</text>
        <text x="285" y="165" fill="#B38600" font-size="12" font-weight="bold" text-anchor="middle">Приватність</text>

        <!-- Arrow from Shield to Sheets -->
        <path d="M 310 110 L 420 110" stroke="#2E7D32" stroke-width="3" fill="none"/>

        <!-- Computer Sheets Box -->
        <rect x="430" y="20" width="160" height="180" rx="10" fill="#ffffff" stroke="#2E7D32" stroke-width="2"/>
        <rect x="430" y="20" width="160" height="30" rx="10" fill="#2E7D32"/>
        <text x="510" y="40" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">Дані (Data Table)</text>

        <line x1="430" y1="90" x2="590" y2="90" stroke="#cccccc" stroke-width="1"/>
        <line x1="430" y1="130" x2="590" y2="130" stroke="#cccccc" stroke-width="1"/>
        <line x1="510" y1="50" x2="510" y2="200" stroke="#cccccc" stroke-width="1"/>

        <text x="470" y="80" font-size="12" fill="#2E7D32">Зелений</text>
        <text x="550" y="80" font-size="12" fill="#2E7D32">3 учні</text>
        <text x="470" y="120" font-size="12" fill="#2E7D32">Синій</text>
        <text x="550" y="120" font-size="12" fill="#2E7D32">5 учнів</text>

        <!-- Markers definitions -->
        <defs>
          <marker id="arrow-green" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#2E7D32"/>
          </marker>
        </defs>
      </svg>
