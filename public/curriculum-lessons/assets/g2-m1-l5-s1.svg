<svg viewBox="0 0 780 300" role="img" aria-labelledby="g2u5a-t g2u5a-d" style="display:block;width:100%;height:auto;margin:16px 0;" xmlns="http://www.w3.org/2000/svg">
    <title id="g2u5a-t">Передача файлу з мережею і без неї</title>
    <desc id="g2u5a-d">Угорі мережа доступна: планшет надсилає малюнок, і проєктор його показує. Унизу мережа зникла: зв'язок обірвано посередині, малюнок лишається на планшеті, а проєктор нічого не отримує.</desc>

