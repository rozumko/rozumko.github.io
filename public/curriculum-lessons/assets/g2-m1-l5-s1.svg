    <line x1="256" y1="229" x2="360" y2="229" stroke="#C0392B" stroke-width="4"/>
    <line x1="396" y1="229" x2="500" y2="229" stroke="#C0392B" stroke-width="4"/>
    <text x="378" y="238" text-anchor="middle" font-size="26" font-family="Arial, sans-serif">✂️</text>
    <text x="378" y="276" text-anchor="middle" font-size="15" fill="#96271B" font-family="Arial, sans-serif">зв'язок обірвано</text>
    <rect x="524" y="198" width="220" height="62" rx="9" fill="#FFFFFF" stroke="#C0392B" stroke-width="2"/>
    <text x="634" y="224" text-anchor="middle" font-size="16" fill="#1A1A1A" font-family="Arial, sans-serif">📽️ Проєктор</text>
