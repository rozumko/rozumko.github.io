    <text x="30" y="40" font-size="17" font-weight="700" fill="#155C32" font-family="Arial, sans-serif">🟢 Мережа є</text>
    <rect x="30" y="56" width="220" height="62" rx="9" fill="#FFFFFF" stroke="#1B6B3A" stroke-width="2"/>
    <text x="140" y="82" text-anchor="middle" font-size="16" fill="#1A1A1A" font-family="Arial, sans-serif">📱 Планшет</text>
    <text x="140" y="105" text-anchor="middle" font-size="15" fill="#3D4757" font-family="Arial, sans-serif">надсилає малюнок</text>
    <line x1="256" y1="87" x2="500" y2="87" stroke="#1B6B3A" stroke-width="4"/>
    <polygon points="500,79 514,87 500,95" fill="#1B6B3A"/>
    <text x="378" y="76" text-anchor="middle" font-size="15" fill="#155C32" font-family="Arial, sans-serif">дані летять</text>
    <rect x="524" y="56" width="220" height="62" rx="9" fill="#FFFFFF" stroke="#1B6B3A" stroke-width="2"/>
    <text x="634" y="82" text-anchor="middle" font-size="16" fill="#1A1A1A" font-family="Arial, sans-serif">📽️ Проєктор</text>
    <text x="634" y="105" text-anchor="middle" font-size="15" fill="#3D4757" font-family="Arial, sans-serif">показує малюнок</text>

    <rect x="6" y="152" width="768" height="140" rx="10" fill="#FFF2F2" stroke="#C0392B" stroke-width="2"/>
    <text x="30" y="182" font-size="17" font-weight="700" fill="#96271B" font-family="Arial, sans-serif">🔴 Мережі немає • offline</text>
    <rect x="30" y="198" width="220" height="62" rx="9" fill="#FFFFFF" stroke="#C0392B" stroke-width="2"/>
