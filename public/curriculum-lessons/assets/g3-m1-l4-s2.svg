<svg viewBox="0 0 860 190" role="img" aria-labelledby="g3u4b-t g3u4b-d" style="display:block;width:100%;height:auto;margin:16px 0;" xmlns="http://www.w3.org/2000/svg">
    <title id="g3u4b-t">Чотири кроки, коли в чаті стало неприємно</title>
    <desc id="g3u4b-d">Перший крок — зупинитися. Другий — не відповідати тим самим. Третій — розповісти довіреному дорослому. Четвертий — якщо потрібно, заблокувати (block) або поскаржитися (report) кнопками самого чату. Зберегти доказ можна лише тоді, коли це безпечно або про це просить дорослий.</desc>
    <rect x="6" y="20" width="200" height="120" rx="12" fill="#FFF9DB" stroke="#B38600" stroke-width="2"/>
    <text x="106" y="58" text-anchor="middle" font-size="26" font-family="Arial, sans-serif">✋</text>
    <text x="106" y="90" text-anchor="middle" font-size="17" font-weight="700" fill="#7A5A00" font-family="Arial, sans-serif">1. Зупинись</text>
    <text x="106" y="118" text-anchor="middle" font-size="15" fill="#3D4757" font-family="Arial, sans-serif">зроби паузу</text>
    <path d="M210 80 H226" fill="none" stroke="#0033A0" stroke-width="3"/>
    <polygon points="226,73 238,80 226,87" fill="#0033A0"/>
    <rect x="244" y="20" width="190" height="120" rx="12" fill="#EAF0FC" stroke="#0033A0" stroke-width="2"/>
    <text x="339" y="58" text-anchor="middle" font-size="26" font-family="Arial, sans-serif">🤐</text>
    <text x="339" y="90" text-anchor="middle" font-size="17" font-weight="700" fill="#0033A0" font-family="Arial, sans-serif">2. Не відповідай</text>
    <text x="339" y="118" text-anchor="middle" font-size="15" fill="#3D4757" font-family="Arial, sans-serif">тим самим</text>
    <path d="M438 80 H454" fill="none" stroke="#0033A0" stroke-width="3"/>
    <polygon points="454,73 466,80 454,87" fill="#0033A0"/>
    <rect x="472" y="20" width="190" height="120" rx="12" fill="#E9F4ED" stroke="#1B6B3A" stroke-width="2"/>
    <text x="567" y="58" text-anchor="middle" font-size="26" font-family="Arial, sans-serif">🙋</text>
    <text x="567" y="90" text-anchor="middle" font-size="17" font-weight="700" fill="#155C32" font-family="Arial, sans-serif">3. Розкажи</text>
    <text x="567" y="118" text-anchor="middle" font-size="15" fill="#3D4757" font-family="Arial, sans-serif">довіреному дорослому</text>
    <path d="M666 80 H682" fill="none" stroke="#0033A0" stroke-width="3"/>
    <polygon points="682,73 694,80 682,87" fill="#0033A0"/>
    <rect x="700" y="20" width="154" height="120" rx="12" fill="#EAF0FC" stroke="#0033A0" stroke-width="2"/>
    <text x="777" y="58" text-anchor="middle" font-size="26" font-family="Arial, sans-serif">🚫</text>
    <text x="777" y="90" text-anchor="middle" font-size="17" font-weight="700" fill="#0033A0" font-family="Arial, sans-serif">4. Block</text>
    <text x="777" y="118" text-anchor="middle" font-size="15" fill="#3D4757" font-family="Arial, sans-serif">або report</text>
    <text x="430" y="174" text-anchor="middle" font-size="15" fill="#3D4757" font-family="Arial, sans-serif">Зберегти доказ — лише якщо це безпечно або про це просить дорослий.</text>
  </svg>
