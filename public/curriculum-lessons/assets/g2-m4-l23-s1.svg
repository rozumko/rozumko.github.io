<svg viewBox="0 0 800 240" role="img" aria-labelledby="svg-title-routes svg-desc-routes" xmlns="http://www.w3.org/2000/svg" width="800" height="240">
      <title id="svg-title-routes">Порівняння двох різних маршрутів на сітці до однієї цілі</title>
      <desc id="svg-desc-routes">Сітка, на якій від Старту до Цілі прокладено два шляхи в обхід каменя. Маршрут 1 іде вгору, потім праворуч — це 3 команди. Маршрут 2 іде праворуч, потім угору — це 4 команди, бо спершу треба повернути.</desc>
      
      <!-- Grid background -->
      <rect x="220" y="20" width="360" height="200" rx="8" fill="#FFFFFF" stroke="#D9E2F0" stroke-width="2"/>
      
      <!-- Grid lines -->
      <line x1="310" y1="20" x2="310" y2="220" stroke="#E2E8F0" stroke-width="1.5"/>
      <line x1="400" y1="20" x2="400" y2="220" stroke="#E2E8F0" stroke-width="1.5"/>
      <line x1="490" y1="20" x2="490" y2="220" stroke="#E2E8F0" stroke-width="1.5"/>
      
      <line x1="220" y1="70" x2="580" y2="70" stroke="#E2E8F0" stroke-width="1.5"/>
      <line x1="220" y1="120" x2="580" y2="120" stroke="#E2E8F0" stroke-width="1.5"/>
      <line x1="220" y1="170" x2="580" y2="170" stroke="#E2E8F0" stroke-width="1.5"/>

      <!-- Start Tile (A1) -->
      <rect x="225" y="175" width="80" height="40" rx="6" fill="#FFD700"/>
      <text x="265" y="200" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1A1A1A" text-anchor="middle">🤖 Старт</text>

      <!-- Destination Tile (C4) -->
      <rect x="495" y="25" width="80" height="40" rx="6" fill="#0033A0"/>
      <text x="535" y="50" font-family="sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">🎯 Ціль</text>

      <!-- Obstacle Tile -->
      <rect x="405" y="125" width="80" height="40" rx="6" fill="#E2E8F0"/>
      <text x="445" y="150" font-family="sans-serif" font-size="18" text-anchor="middle">🪨</text>

      <!-- Route 1 (Blue - Direct) -->
      <path d="M 265 175 L 265 45 L 495 45" stroke="#0033A0" stroke-width="3.5" stroke-dasharray="6,4" fill="none"/>
      
      <!-- Route 2 (Orange - Around) -->
      <path d="M 265 195 L 535 195 L 535 65" stroke="#D97706" stroke-width="3.5" fill="none"/>

      <!-- Labels Legend -->
      <rect x="20" y="50" width="180" height="60" rx="8" fill="#F0F4F8" stroke="#0033A0"/>
      <line x1="30" y1="70" x2="60" y2="70" stroke="#0033A0" stroke-width="3" stroke-dasharray="4,3"/>
      <text x="70" y="74" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0033A0">Маршрут 1 (3 команди)</text>
      <text x="70" y="94" font-family="sans-serif" font-size="13" fill="#52606D">менше команд</text>

      <rect x="20" y="130" width="180" height="60" rx="8" fill="#FFFBEB" stroke="#D97706"/>
      <line x1="30" y1="150" x2="60" y2="150" stroke="#D97706" stroke-width="3"/>
      <text x="70" y="154" font-family="sans-serif" font-size="12" font-weight="bold" fill="#D97706">Маршрут 2 (4 команди)</text>
      <text x="70" y="174" font-family="sans-serif" font-size="13" fill="#52606D">інший шлях</text>
    </svg>
