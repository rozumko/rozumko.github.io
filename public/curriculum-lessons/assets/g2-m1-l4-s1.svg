<svg viewBox="0 0 780 300" role="img" aria-labelledby="g2u4a-t g2u4a-d" xmlns="http://www.w3.org/2000/svg" width="780" height="300">
    <title id="g2u4a-t">Схема мережі комп'ютерного класу</title>
    <desc id="g2u4a-d">У центрі маршрутизатор. Принтер і проєктор з'єднані з ним кабелем — суцільними лініями. Ноутбук учителя і планшет учня з'єднані через Wi-Fi — пунктирними лініями. Усі чотири пристрої можуть обмінюватися файлами через центр.</desc>

