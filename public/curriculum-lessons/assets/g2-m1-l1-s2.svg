<svg viewBox="0 0 700 260" role="img" aria-labelledby="g2u1b-t g2u1b-d" xmlns="http://www.w3.org/2000/svg" width="700" height="260">
    <title id="g2u1b-t">Три системи за одним правилом входу, опрацювання і виходу</title>
    <desc id="g2u1b-d">Камера бачить кота, програма складає знімок, і фото з'являється на екрані. Датчик міряє тепло, правило вирішує, що стало холодно, і обігрівач вмикається. Натиснута кнопка замикає схему, і лунає дзвінок.</desc>

    <text x="112" y="26" text-anchor="middle" font-size="15" font-weight="700" fill="#0033A0" font-family="Arial, sans-serif">ВХІД</text>
    <text x="350" y="26" text-anchor="middle" font-size="15" font-weight="700" fill="#0033A0" font-family="Arial, sans-serif">ОПРАЦЮВАННЯ</text>
    <text x="588" y="26" text-anchor="middle" font-size="15" font-weight="700" fill="#0033A0" font-family="Arial, sans-serif">ВИХІД</text>

