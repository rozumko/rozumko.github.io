    <text x="112" y="66" text-anchor="middle" font-size="15" fill="#1A1A1A" font-family="Arial, sans-serif">📷 камера бачить кота</text>
    <text x="112" y="87" text-anchor="middle" font-size="14" fill="#3D4757" font-family="Arial, sans-serif">Фотоапарат у планшеті</text>
