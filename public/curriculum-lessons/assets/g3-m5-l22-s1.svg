<svg viewBox="0 0 860 200" role="img" aria-labelledby="g3u22a-t g3u22a-d" xmlns="http://www.w3.org/2000/svg" width="860" height="200">
    <title id="g3u22a-t">Складне завдання, його частини і шлях input → кроки → output</title>
