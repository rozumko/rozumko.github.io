    <text x="252" y="86" text-anchor="middle" font-size="16" font-weight="700" fill="#7A5A00" font-family="Arial, sans-serif">Частини</text>
    <text x="252" y="112" text-anchor="middle" font-size="15" fill="#3D4757" font-family="Arial, sans-serif">3–5 секцій</text>
