<svg viewBox="0 0 800 220" role="img" aria-labelledby="svg-title-input svg-desc-input" style="display:block;width:100%;height:auto;max-width:800px;margin:18px auto;" xmlns="http://www.w3.org/2000/svg">
      <title id="svg-title-input">Порівняння друкування на клавіатурі та голосового введення</title>
      <desc id="svg-desc-input">Клавіатурою текст вводиш сам, літера за літерою, але можна натиснути не ту клавішу. Голосом довгий текст іноді ввести швидше, але програма може не розчути слово. В обох випадках текст перевіряє людина.</desc>
      
      <!-- Box 1: Keyboard Typing -->
      <rect x="20" y="20" width="350" height="180" rx="10" fill="#FFFFFF" stroke="#D9E2F0" stroke-width="2"/>
      <rect x="20" y="20" width="350" height="40" rx="10" fill="#0033A0"/>
      <text x="195" y="45" font-family="sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">⌨️ Клавіатура (typing)</text>
      <text x="195" y="85" font-family="sans-serif" font-size="14" fill="#1A1A1A" text-anchor="middle">• Вводиш сам, літера за літерою</text>
      <text x="195" y="115" font-family="sans-serif" font-size="14" font-weight="bold" fill="#C53030" text-anchor="middle">• Можна натиснути не ту клавішу</text>
      <text x="195" y="145" font-family="sans-serif" font-size="14" fill="#52606D" text-anchor="middle">Зручно для паролів і чисел</text>
      <text x="195" y="180" font-family="sans-serif" font-size="15" font-weight="bold" fill="#0033A0" text-anchor="middle">✅ Перевір текст</text>

      <!-- Box 2: Voice Input -->
      <rect x="430" y="20" width="350" height="180" rx="10" fill="#F0F4F8" stroke="#0033A0" stroke-width="2"/>
      <rect x="430" y="20" width="350" height="40" rx="10" fill="#FFD700"/>
      <text x="605" y="45" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1A1A1A" text-anchor="middle">🎙️ Голосове введення (voice input)</text>
      <text x="605" y="85" font-family="sans-serif" font-size="14" fill="#1A1A1A" text-anchor="middle">• Іноді швидше для довгого тексту</text>
      <text x="605" y="115" font-family="sans-serif" font-size="14" font-weight="bold" fill="#C53030" text-anchor="middle">• Може не розчути слово</text>
      <text x="605" y="145" font-family="sans-serif" font-size="14" fill="#52606D" text-anchor="middle">Зручно, коли руки зайняті</text>
      <text x="605" y="180" font-family="sans-serif" font-size="15" font-weight="bold" fill="#0033A0" text-anchor="middle">✅ Перевір текст</text>
    </svg>
