<svg viewBox="0 0 600 240" role="img" aria-labelledby="grid-svg-title grid-svg-desc" xmlns="http://www.w3.org/2000/svg" width="600" height="240">
        <title id="grid-svg-title">Цифрова сітка маршруту робота</title>
        <desc id="grid-svg-desc">Ця схема показує сітку три на три клітинки з роботом на старті, перешкодою посередині та ціллю у правому верхньому кутку.</desc>
        <!-- Background -->
        <rect width="600" height="240" rx="8" fill="#FAFAFA"/>

        <!-- Grid 3x3 -->
        <g transform="translate(40, 30)">
          <!-- Row 1 -->
          <rect x="0" y="0" width="50" height="50" fill="#FFFFFF" stroke="#D9E2F0" stroke-width="2"/>
          <rect x="50" y="0" width="50" height="50" fill="#FFFFFF" stroke="#D9E2F0" stroke-width="2"/>
          <rect x="100" y="0" width="50" height="50" fill="#FFF2F2" stroke="#F9D2D2" stroke-width="2"/> <!-- GOAL -->
          <text x="125" y="30" font-size="20" text-anchor="middle">🏁</text>
          <text x="125" y="45" font-size="12" font-family="sans-serif" font-weight="bold" fill="#D32F2F" text-anchor="middle">GOAL</text>

          <!-- Row 2 -->
          <rect x="0" y="50" width="50" height="50" fill="#FFFFFF" stroke="#D9E2F0" stroke-width="2"/>
          <rect x="50" y="50" width="50" height="50" fill="#FFF0F5" stroke="#F9D2D2" stroke-width="2"/> <!-- OBSTACLE -->
          <text x="75" y="80" font-size="20" text-anchor="middle">🚧</text>
          <text x="75" y="95" font-size="12" font-family="sans-serif" font-weight="bold" fill="#D32F2F" text-anchor="middle">OBSTACLE</text>
          <rect x="100" y="50" width="50" height="50" fill="#FFFFFF" stroke="#D9E2F0" stroke-width="2"/>

          <!-- Row 3 -->
          <rect x="0" y="100" width="50" height="50" fill="#E8F4F8" stroke="#BCE3F9" stroke-width="2"/> <!-- START -->
          <text x="18" y="128" font-size="18" text-anchor="middle">🤖</text>
          <text x="38" y="128" font-size="14" font-family="sans-serif" font-weight="bold" fill="#0033A0" text-anchor="middle">↑</text>
          <text x="25" y="145" font-size="12" font-family="sans-serif" font-weight="bold" fill="#0033A0" text-anchor="middle">START</text>
          <rect x="50" y="100" width="50" height="50" fill="#FFFFFF" stroke="#D9E2F0" stroke-width="2"/>
          <rect x="100" y="100" width="50" height="50" fill="#FFFFFF" stroke="#D9E2F0" stroke-width="2"/>

          <!-- Short Route Arrow -->
          <path d="M 25 125 L 25 25 L 125 25" fill="none" stroke="#2E7D32" stroke-width="3" stroke-dasharray="4" marker-end="url(#arrow-green)"/>
        </g>

        <!-- Route Descriptions -->
        <g transform="translate(240, 40)">
          <rect width="320" height="140" rx="6" fill="#FFFFFF" stroke="#D9E2F0" stroke-width="1.5"/>
          <text x="160" y="25" font-size="13" font-family="sans-serif" font-weight="bold" fill="#0033A0" text-anchor="middle">Аналіз нашого маршруту:</text>

          <circle cx="25" cy="55" r="6" fill="#2E7D32"/>
          <text x="40" y="59" font-size="12" font-family="sans-serif" font-weight="bold" fill="#2E7D32">Короткий шлях (Зелений):</text>
          <text x="40" y="77" font-size="12" font-family="sans-serif" fill="#1A1A1A">Forward × 2 → Turn right → Forward × 2.</text>

          <circle cx="25" cy="105" r="6" fill="#0033A0"/>
          <text x="40" y="109" font-size="12" font-family="sans-serif" font-weight="bold" fill="#0033A0">Правило:</text>
          <text x="40" y="127" font-size="12" font-family="sans-serif" fill="#1A1A1A">Цей шлях успішно оминає перешкоду 🚧!</text>
        </g>

        <!-- Markers -->
        <defs>
          <marker id="arrow-green" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#2E7D32"/>
          </marker>
        </defs>
      </svg>
