<svg viewBox="0 0 600 240" role="img" aria-labelledby="svg-title svg-desc" style="display:block; width:100%; height:auto; max-width:600px; margin:16px auto;" xmlns="http://www.w3.org/2000/svg">
        <title id="svg-title">Схема порівняння дубльованого коду та циклу Repeat</title>
        <desc id="svg-desc">Ця схема показує довгий код із чотирьох дубльованих блоків руху та короткий цикл із використанням блоку Repeat 4 times.</desc>
        <!-- Background -->
        <rect width="600" height="240" rx="8" fill="#FAFAFA"/>

        <!-- Long Duplicated Code -->
        <g transform="translate(15, 15)">
          <rect width="270" height="210" rx="6" fill="#FFF2F2" stroke="#F9D2D2" stroke-width="1.5"/>
          <text x="135" y="30" font-size="12" font-family="sans-serif" font-weight="bold" fill="#D32F2F" text-anchor="middle">❌ Дубликація блоків (Duplicated Code)</text>

          <g transform="translate(15, 45)">
            <rect width="240" height="32" rx="4" fill="#ffffff" stroke="#D32F2F"/>
            <text x="120" y="21" font-size="12" font-family="sans-serif" fill="#1A1A1A" text-anchor="middle">1. Step Right ➔ + Jump ⬆</text>
          </g>
          <g transform="translate(15, 83)">
            <rect width="240" height="32" rx="4" fill="#ffffff" stroke="#D32F2F"/>
            <text x="120" y="21" font-size="12" font-family="sans-serif" fill="#1A1A1A" text-anchor="middle">2. Step Right ➔ + Jump ⬆</text>
          </g>
          <g transform="translate(15, 121)">
            <rect width="240" height="32" rx="4" fill="#ffffff" stroke="#D32F2F"/>
            <text x="120" y="21" font-size="12" font-family="sans-serif" fill="#1A1A1A" text-anchor="middle">3. Step Right ➔ + Jump ⬆</text>
          </g>
          <g transform="translate(15, 159)">
            <rect width="240" height="32" rx="4" fill="#ffffff" stroke="#D32F2F"/>
            <text x="120" y="21" font-size="12" font-family="sans-serif" fill="#1A1A1A" text-anchor="middle">4. Step Right ➔ + Jump ⬆</text>
          </g>
        </g>

        <!-- Short Repeat Loop -->
        <g transform="translate(315, 15)">
          <rect width="270" height="210" rx="6" fill="#E8F5E9" stroke="#C8E6C9" stroke-width="1.5"/>
          <text x="135" y="30" font-size="12" font-family="sans-serif" font-weight="bold" fill="#2E7D32" text-anchor="middle">✅ Цикл (Repeat Loop - Shorter!)</text>

          <g transform="translate(15, 50)">
            <rect width="240" height="135" rx="8" fill="#ffffff" stroke="#2E7D32" stroke-width="2" stroke-dasharray="4"/>
            <text x="120" y="30" font-size="13" font-family="sans-serif" font-weight="bold" fill="#FF9800" text-anchor="middle">🔁 REPEAT 4 TIMES</text>
            <rect x="25" y="45" width="190" height="40" rx="4" fill="#0033A0"/>
            <text x="115" y="70" font-size="12" font-family="sans-serif" font-weight="bold" fill="#ffffff" text-anchor="middle">Step Right ➔ + Jump ⬆</text>
            <text x="120" y="115" font-size="12" font-family="sans-serif" fill="#555555" text-anchor="middle">(Повтори 1 пару дій 4 рази)</text>
          </g>
        </g>
      </svg>
