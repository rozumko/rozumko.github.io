<svg viewBox="0 0 800 240" role="img" aria-labelledby="svg-title-stat svg-desc-stat" style="display:block;width:100%;height:auto;max-width:800px;margin:18px auto;" xmlns="http://www.w3.org/2000/svg">
      <title id="svg-title-stat">Порівняння нестатистичного та статистичного запитання</title>
      <desc id="svg-desc-stat">Схема показує різницю між запитанням з однією відповіддю та запитанням, що збирає різні відповіді від багатьох людей.</desc>
      
      <!-- Non-statistical Box -->
      <rect x="20" y="20" width="350" height="200" rx="10" fill="#FAFAFA" stroke="#D9E2F0" stroke-width="2"/>
      <rect x="20" y="20" width="350" height="40" rx="10" fill="#E2E8F0"/>
      <text x="195" y="45" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1A1A1A" text-anchor="middle">Нестатистичне запитання</text>
      <text x="195" y="85" font-family="sans-serif" font-size="15" fill="#1A1A1A" text-anchor="middle">«Скільки днів у тижні?»</text>
      <path d="M 195 100 L 195 130" stroke="#0033A0" stroke-width="2"/>
      <rect x="115" y="135" width="160" height="50" rx="6" fill="#FFFFFF" stroke="#0033A0" stroke-width="1.5"/>
      <text x="195" y="157" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0033A0" text-anchor="middle">1 фіксована відповідь</text>
      <text x="195" y="175" font-family="sans-serif" font-size="13" fill="#52606D" text-anchor="middle">(7 днів — дані не змінюються)</text>

      <!-- Statistical Box -->
      <rect x="430" y="20" width="350" height="200" rx="10" fill="#F0F4F8" stroke="#0033A0" stroke-width="2"/>
      <rect x="430" y="20" width="350" height="40" rx="10" fill="#0033A0"/>
      <text x="605" y="45" font-family="sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Статистичне запитання</text>
      <text x="605" y="85" font-family="sans-serif" font-size="15" fill="#1A1A1A" text-anchor="middle">«Який улюблений фрукт учнів?»</text>
      <path d="M 605 100 L 605 130" stroke="#0033A0" stroke-width="2"/>
      <rect x="505" y="135" width="200" height="50" rx="6" fill="#FFFFFF" stroke="#0033A0" stroke-width="1.5"/>
      <text x="605" y="157" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0033A0" text-anchor="middle">Багато різних відповідей</text>
      <text x="605" y="175" font-family="sans-serif" font-size="13" fill="#52606D" text-anchor="middle">(Яблуко, банан, груша — це дані)</text>
    </svg>
