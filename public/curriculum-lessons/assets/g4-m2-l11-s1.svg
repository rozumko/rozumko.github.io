      <text x="420" y="129">Марко</text><text x="570" y="129">4-А</text><text x="700" y="129">шахи</text>
      <text x="420" y="167">Ліна</text><text x="570" y="167">4-Б</text><text x="700" y="167">—</text>
      <text x="420" y="203">Остап</text><text x="570" y="203">4-А</text><text x="700" y="203">футбол</text>
