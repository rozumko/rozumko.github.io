    <desc id="g1u2-d">Спілкування — відеодзвінки друзям. Розваги — ігри, музика, мультфільми. Творчість — малюнки й власні історії. Дослідження — пошук відповідей про погоду й космос. Керування — робота світлофорів, роботів та іграшок.</desc>

