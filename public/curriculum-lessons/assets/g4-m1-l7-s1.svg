    <path d="M582 99 L636 128" fill="none" stroke="#0033A0" stroke-width="2" marker-end="url(#g4u7a-m)"/>
    <path d="M582 161 L636 132" fill="none" stroke="#0033A0" stroke-width="2" marker-end="url(#g4u7a-m)"/>
