    <text x="747" y="144" text-anchor="middle" font-size="15" fill="#3D4757" font-family="Arial, sans-serif">може побачити</text>
    <text x="747" y="166" text-anchor="middle" font-size="15" fill="#3D4757" font-family="Arial, sans-serif">навіть пізніше</text>
