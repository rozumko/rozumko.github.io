<svg viewBox="0 0 860 290" role="img" aria-labelledby="g4u12a-t g4u12a-d" style="display:block;width:100%;height:auto;margin:16px 0;" xmlns="http://www.w3.org/2000/svg">
    <title id="g4u12a-t">Сортування і фільтр</title>
    <desc id="g4u12a-d">Ліворуч початкова таблиця з чотирьох книжок. Посередині вони ж, відсортовані за назвою від А до Я: книжок так само чотири, змінився лише порядок. Праворуч фільтр «Жанр = Фентезі»: видно лише дві книжки, дві інші тимчасово сховані.</desc>
    <g font-family="Arial, sans-serif">
      <rect x="6" y="14" width="260" height="44" rx="8" fill="#F0F4F8"/>
      <text x="136" y="42" text-anchor="middle" font-size="16" font-weight="700" fill="#0033A0">Початкова таблиця</text>
      <rect x="298" y="14" width="260" height="44" rx="8" fill="#0033A0"/>
      <text x="428" y="42" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">Сортування А → Я</text>
      <rect x="590" y="14" width="264" height="44" rx="8" fill="#FFF9DB" stroke="#B38600" stroke-width="2"/>
      <text x="722" y="42" text-anchor="middle" font-size="16" font-weight="700" fill="#7A5A00">Фільтр: Фентезі</text>
    </g>
    <g font-size="15" fill="#1A1A1A" font-family="Arial, sans-serif">
      <rect x="6" y="68" width="260" height="36" rx="6" fill="#FFFFFF" stroke="#D9E2F0"/><text x="18" y="92">Райлі • Фантастика</text>
      <rect x="6" y="110" width="260" height="36" rx="6" fill="#FFFFFF" stroke="#D9E2F0"/><text x="18" y="134">Казки • Фентезі</text>
      <rect x="6" y="152" width="260" height="36" rx="6" fill="#FFFFFF" stroke="#D9E2F0"/><text x="18" y="176">Дракони • Фентезі</text>
      <rect x="6" y="194" width="260" height="36" rx="6" fill="#FFFFFF" stroke="#D9E2F0"/><text x="18" y="218">Космос • Фантастика</text>

      <rect x="298" y="68" width="260" height="36" rx="6" fill="#EAF0FC" stroke="#0033A0"/><text x="310" y="92">Дракони • Фентезі</text>
      <rect x="298" y="110" width="260" height="36" rx="6" fill="#EAF0FC" stroke="#0033A0"/><text x="310" y="134">Казки • Фентезі</text>
      <rect x="298" y="152" width="260" height="36" rx="6" fill="#EAF0FC" stroke="#0033A0"/><text x="310" y="176">Космос • Фантастика</text>
      <rect x="298" y="194" width="260" height="36" rx="6" fill="#EAF0FC" stroke="#0033A0"/><text x="310" y="218">Райлі • Фантастика</text>

      <rect x="590" y="68" width="264" height="36" rx="6" fill="#FFFFFF" stroke="#B38600"/><text x="602" y="92">Казки • Фентезі</text>
      <rect x="590" y="110" width="264" height="36" rx="6" fill="#FFFFFF" stroke="#B38600"/><text x="602" y="134">Дракони • Фентезі</text>
      <rect x="590" y="152" width="264" height="78" rx="6" fill="#F8FAFC" stroke="#D9E2F0" stroke-dasharray="6 5"/><text x="722" y="196" text-anchor="middle" fill="#3D4757">2 записи сховано</text>
    </g>
    <g font-size="15" font-weight="700" font-family="Arial, sans-serif" text-anchor="middle">
