<svg viewBox="0 0 600 240" role="img" aria-labelledby="svg-title svg-desc" style="display:block; width:100%; height:auto; max-width:600px; margin:16px auto;" xmlns="http://www.w3.org/2000/svg">
        <title id="svg-title">Порівняння довгого та короткого запису повторюваної дії</title>
        <desc id="svg-desc">Ця схема показує чотири однакові кроки та короткий запис: крок праворуч помножити на чотири.</desc>
        <!-- Background -->
        <rect width="600" height="240" rx="8" fill="#FAFAFA"/>

        <!-- Long Algorithm Block -->
        <g transform="translate(10, 10)">
          <rect width="275" height="220" rx="6" fill="#FFF2F2" stroke="#F9D2D2" stroke-width="2"/>
          <text x="137" y="30" font-size="13" font-family="sans-serif" font-weight="bold" fill="#D32F2F" text-anchor="middle">Довгий алгоритм (Long Algorithm)</text>

          <g transform="translate(15, 50)">
            <rect width="245" height="32" rx="4" fill="#ffffff" stroke="#D32F2F" stroke-width="1"/>
            <text x="122" y="21" font-size="12" font-family="sans-serif" fill="#1A1A1A" text-anchor="middle">1. Step Right ➔</text>
          </g>
          <g transform="translate(15, 88)">
            <rect width="245" height="32" rx="4" fill="#ffffff" stroke="#D32F2F" stroke-width="1"/>
            <text x="122" y="21" font-size="12" font-family="sans-serif" fill="#1A1A1A" text-anchor="middle">2. Step Right ➔</text>
          </g>
          <g transform="translate(15, 126)">
            <rect width="245" height="32" rx="4" fill="#ffffff" stroke="#D32F2F" stroke-width="1"/>
            <text x="122" y="21" font-size="12" font-family="sans-serif" fill="#1A1A1A" text-anchor="middle">3. Step Right ➔</text>
          </g>
          <g transform="translate(15, 164)">
            <rect width="245" height="32" rx="4" fill="#ffffff" stroke="#D32F2F" stroke-width="1"/>
            <text x="122" y="21" font-size="12" font-family="sans-serif" fill="#1A1A1A" text-anchor="middle">4. Step Right ➔</text>
          </g>
        </g>

        <!-- Short Algorithm with Repeat Block -->
        <g transform="translate(315, 10)">
          <rect width="275" height="220" rx="6" fill="#E8F5E9" stroke="#C8E6C9" stroke-width="2"/>
          <text x="137" y="30" font-size="13" font-family="sans-serif" font-weight="bold" fill="#2E7D32" text-anchor="middle">Короткий запис (Shorter!)</text>

          <g transform="translate(15, 60)">
            <rect width="245" height="130" rx="8" fill="#ffffff" stroke="#2E7D32" stroke-width="2" stroke-dasharray="4"/>
            <text x="122" y="30" font-size="13" font-family="sans-serif" font-weight="bold" fill="#2E7D32" text-anchor="middle">ОДНАКОВА ДІЯ × 4</text>
            <rect x="25" y="45" width="195" height="40" rx="4" fill="#0033A0"/>
            <text x="122" y="70" font-size="12" font-family="sans-serif" font-weight="bold" fill="#ffffff" text-anchor="middle">Step Right ➔</text>
            <text x="122" y="110" font-size="12" font-family="sans-serif" fill="#555555" text-anchor="middle">(Повтори 1 дію 4 рази)</text>
          </g>
        </g>
      </svg>
