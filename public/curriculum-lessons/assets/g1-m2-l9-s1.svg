<svg viewBox="0 0 600 240" style="max-width: 100%; height: auto; display: block; margin: 0 auto; background-color: #ffffff; border-radius: 6px;" aria-label="Схема пристроїв введення та виведення" xmlns="http://www.w3.org/2000/svg">
      <!-- Grid line -->
      <line x1="300" y1="10" x2="300" y2="230" stroke="#E2E8F0" stroke-width="2" stroke-dasharray="4 4"/>

      <!-- Inputs Column (Left) -->
      <text x="140" y="30" text-anchor="middle" fill="#0033A0" font-size="14" font-weight="bold">📥 ВВЕДЕННЯ (Input)</text>

      <g transform="translate(20, 50)">
        <rect x="0" y="0" width="100" height="36" rx="6" fill="#FAFDFE" stroke="#BCE3F9" stroke-width="1.5"/>
        <text x="50" y="22" text-anchor="middle" fill="#333333" font-size="12" font-weight="bold">⌨️ Клавіатура</text>
        <path d="M 105 18 L 130 18" stroke="#0033A0" stroke-width="2" marker-end="url(#arrow-blue)" fill="none"/>
      </g>

      <g transform="translate(140, 50)">
        <rect x="0" y="0" width="100" height="36" rx="6" fill="#FAFDFE" stroke="#BCE3F9" stroke-width="1.5"/>
        <text x="50" y="22" text-anchor="middle" fill="#333333" font-size="12" font-weight="bold">🎙️ Мікрофон</text>
        <path d="M 105 18 Q 120 18 120 40 L 120 70" stroke="#0033A0" stroke-width="2" marker-end="url(#arrow-blue)" fill="none"/>
      </g>

      <g transform="translate(20, 110)">
        <rect x="0" y="0" width="100" height="36" rx="6" fill="#FAFDFE" stroke="#BCE3F9" stroke-width="1.5"/>
        <text x="50" y="22" text-anchor="middle" fill="#333333" font-size="12" font-weight="bold">🖱️ Мишка</text>
        <path d="M 105 18 L 130 18" stroke="#0033A0" stroke-width="2" marker-end="url(#arrow-blue)" fill="none"/>
      </g>

      <g transform="translate(140, 110)">
        <rect x="0" y="0" width="100" height="36" rx="6" fill="#FAFDFE" stroke="#BCE3F9" stroke-width="1.5"/>
        <text x="50" y="22" text-anchor="middle" fill="#333333" font-size="12" font-weight="bold">📷 Камера</text>
        <path d="M 105 18 L 125 18 L 125 20" stroke="#0033A0" stroke-width="2" marker-end="url(#arrow-blue)" fill="none"/>
      </g>

      <!-- Center System Box / Touchscreen -->
      <g transform="translate(260, 80)">
        <rect x="0" y="0" width="80" height="80" rx="8" fill="#FFF2F2" stroke="#F9D2D2" stroke-width="2"/>
        <text x="40" y="22" text-anchor="middle" fill="#D32F2F" font-size="12" font-weight="bold">📱 BOTH</text>
        <text x="40" y="38" text-anchor="middle" fill="#333333" font-size="12" font-weight="bold">Сенсорний</text>
        <text x="40" y="54" text-anchor="middle" fill="#333333" font-size="12" font-weight="bold">екран</text>
        <text x="40" y="70" text-anchor="middle" fill="#555555" font-size="12">In &amp; Out</text>
      </g>

      <!-- Outputs Column (Right) -->
      <text x="460" y="30" text-anchor="middle" fill="#B38600" font-size="14" font-weight="bold">📤 ВИВЕДЕННЯ (Output)</text>

      <g transform="translate(360, 50)">
        <path d="M -15 18 L 0 18" stroke="#B38600" stroke-width="2" fill="none"/>
        <rect x="0" y="0" width="100" height="36" rx="6" fill="#FFFDF0" stroke="#FFE0A3" stroke-width="1.5"/>
        <text x="50" y="22" text-anchor="middle" fill="#333333" font-size="12" font-weight="bold">🖥️ Екран</text>
      </g>

      <g transform="translate(480, 50)">
        <path d="M -15 18 L 0 18" stroke="#B38600" stroke-width="2" fill="none"/>
        <rect x="0" y="0" width="100" height="36" rx="6" fill="#FFFDF0" stroke="#FFE0A3" stroke-width="1.5"/>
        <text x="50" y="22" text-anchor="middle" fill="#333333" font-size="12" font-weight="bold">🔊 Колонки</text>
      </g>

      <g transform="translate(360, 110)">
        <path d="M -15 18 L 0 18" stroke="#B38600" stroke-width="2" fill="none"/>
        <rect x="0" y="0" width="100" height="36" rx="6" fill="#FFFDF0" stroke="#FFE0A3" stroke-width="1.5"/>
        <text x="50" y="22" text-anchor="middle" fill="#333333" font-size="12" font-weight="bold">🖨️ Принтер</text>
      </g>

      <g transform="translate(480, 110)">
        <path d="M -15 18 L 0 18" stroke="#B38600" stroke-width="2" fill="none"/>
        <rect x="0" y="0" width="100" height="36" rx="6" fill="#FFFDF0" stroke="#FFE0A3" stroke-width="1.5"/>
        <text x="50" y="22" text-anchor="middle" fill="#333333" font-size="12" font-weight="bold">🎧 Навушники</text>
      </g>

      <!-- Definitions of arrows -->
      <defs>
        <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#0033A0"/>
        </marker>
      </defs>
    </svg>
