<svg viewBox="0 0 760 250" role="img" aria-labelledby="g1m5u8-title g1m5u8-desc" xmlns="http://www.w3.org/2000/svg" width="760" height="250">
    <title id="g1m5u8-title">П'ять кроків створення цифрової історії</title>
    <desc id="g1m5u8-desc">Послідовність із п'яти кроків: задум, план, створення, тестування і презентація.</desc>
    <defs>
      <marker id="g1m5u8-arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#0033A0"/></marker>
    </defs>
    <path d="M140 105 H172 M286 105 H318 M432 105 H464 M578 105 H610" stroke="#0033A0" stroke-width="4" marker-end="url(#g1m5u8-arrow)"/>
    <g font-family="Arial, sans-serif" text-anchor="middle">
      <rect x="8" y="55" width="132" height="100" rx="12" fill="#EAF0FC" stroke="#0033A0" stroke-width="2"/>
      <text x="74" y="96" font-size="27">💭</text><text x="74" y="128" font-size="17" font-weight="700" fill="#0033A0">1. Задум</text>
      <rect x="154" y="55" width="132" height="100" rx="12" fill="#FFF9DB" stroke="#B38600" stroke-width="2"/>
      <text x="220" y="96" font-size="27">📝</text><text x="220" y="128" font-size="17" font-weight="700" fill="#7A5A00">2. План</text>
      <rect x="300" y="55" width="132" height="100" rx="12" fill="#E9F4ED" stroke="#1B6B3A" stroke-width="2"/>
      <text x="366" y="96" font-size="27">🧩</text><text x="366" y="128" font-size="17" font-weight="700" fill="#155C32">3. Створи</text>
      <rect x="446" y="55" width="132" height="100" rx="12" fill="#FCEDEB" stroke="#B83A2D" stroke-width="2"/>
      <text x="512" y="96" font-size="27">🔎</text><text x="512" y="128" font-size="17" font-weight="700" fill="#96271B">4. Перевір</text>
      <rect x="592" y="55" width="160" height="100" rx="12" fill="#F1EAFE" stroke="#6B46C1" stroke-width="2"/>
      <text x="672" y="96" font-size="27">🎤</text><text x="672" y="128" font-size="17" font-weight="700" fill="#553C9A">5. Покажи</text>
      <text x="380" y="205" font-size="17" fill="#3D4757">Автор керує кожним кроком і вирішує, якою буде історія.</text>
    </g>
  </svg>
