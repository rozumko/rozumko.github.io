<svg viewBox="0 0 860 190" role="img" aria-labelledby="g4u8a-t g4u8a-d" xmlns="http://www.w3.org/2000/svg" width="860" height="190">
    <title id="g4u8a-t">Шифрування і розшифрування з ключем</title>
    <desc id="g4u8a-d">Відкритий текст CAB шифрують ключем 3 і отримують шифротекст FDE. Одержувач розшифровує його тим самим ключем 3 і знову бачить CAB. Хто перехопить FDE без ключа, побачить лише незрозумілі літери.</desc>
    <rect x="6" y="20" width="190" height="110" rx="12" fill="#EAF0FC" stroke="#0033A0" stroke-width="2"/>
    <text x="101" y="54" text-anchor="middle" font-size="16" font-weight="700" fill="#0033A0" font-family="Arial, sans-serif">PLAINTEXT</text>
    <text x="101" y="98" text-anchor="middle" font-size="26" font-weight="700" fill="#1A1A1A" font-family="'Courier New',monospace">CAB</text>
    <path d="M198 75 H214" fill="none" stroke="#0033A0" stroke-width="3"/>
    <polygon points="212,68 224,75 212,82" fill="#0033A0"/>
    <rect x="226" y="20" width="190" height="110" rx="12" fill="#0033A0"/>
    <text x="321" y="54" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF" font-family="Arial, sans-serif">🔒 ENCRYPT</text>
    <text x="321" y="92" text-anchor="middle" font-size="15" fill="#FFD700" font-family="Arial, sans-serif">ключ = 3</text>
    <text x="321" y="116" text-anchor="middle" font-size="15" fill="#D6E0F5" font-family="Arial, sans-serif">зсув уперед</text>
    <path d="M418 75 H434" fill="none" stroke="#0033A0" stroke-width="3"/>
    <polygon points="432,68 444,75 432,82" fill="#0033A0"/>
    <rect x="446" y="20" width="190" height="110" rx="12" fill="#FFF9DB" stroke="#B38600" stroke-width="2"/>
    <text x="541" y="54" text-anchor="middle" font-size="16" font-weight="700" fill="#7A5A00" font-family="Arial, sans-serif">CIPHERTEXT</text>
    <text x="541" y="98" text-anchor="middle" font-size="26" font-weight="700" fill="#96271B" font-family="'Courier New',monospace">FDE</text>
    <path d="M638 75 H654" fill="none" stroke="#0033A0" stroke-width="3"/>
    <polygon points="652,68 664,75 652,82" fill="#0033A0"/>
    <rect x="666" y="20" width="188" height="110" rx="12" fill="#E9F4ED" stroke="#1B6B3A" stroke-width="2"/>
    <text x="760" y="54" text-anchor="middle" font-size="16" font-weight="700" fill="#155C32" font-family="Arial, sans-serif">🔓 DECRYPT</text>
    <text x="760" y="92" text-anchor="middle" font-size="15" fill="#155C32" font-family="Arial, sans-serif">ключ = 3, назад</text>
    <text x="760" y="120" text-anchor="middle" font-size="22" font-weight="700" fill="#1A1A1A" font-family="'Courier New',monospace">CAB</text>
    <text x="430" y="170" text-anchor="middle" font-size="15" fill="#3D4757" font-family="Arial, sans-serif">хто перехопить FDE без ключа, побачить лише незрозумілі літери</text>
  </svg>
