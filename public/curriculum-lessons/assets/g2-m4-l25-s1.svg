<svg viewBox="0 0 800 240" role="img" aria-labelledby="svg-title-scratch svg-desc-scratch" style="display:block;width:100%;height:auto;max-width:800px;margin:18px auto;" xmlns="http://www.w3.org/2000/svg">
      <title id="svg-title-scratch">Шлях від алгоритму до запуску програми в Scratch</title>
      <desc id="svg-desc-scratch">Схема демонструє перетворення кроків алгоритму у кольорові блоки Scratch, об'єднання їх у скрипт та виконання на сцені.</desc>
      
      <!-- Box 1: Algorithm -->
      <rect x="20" y="30" width="170" height="180" rx="10" fill="#FFFFFF" stroke="#D9E2F0" stroke-width="2"/>
      <rect x="20" y="30" width="170" height="36" rx="10" fill="#0033A0"/>
      <text x="105" y="53" font-family="sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1. Алгоритм (План)</text>
      <text x="105" y="95" font-family="sans-serif" font-size="28" text-anchor="middle">📝</text>
      <text x="105" y="130" font-family="sans-serif" font-size="12" fill="#1A1A1A" text-anchor="middle">• Крок 1: Старт</text>
      <text x="105" y="150" font-family="sans-serif" font-size="12" fill="#1A1A1A" text-anchor="middle">• Крок 2: Рух вперед</text>
      <text x="105" y="170" font-family="sans-serif" font-size="12" fill="#1A1A1A" text-anchor="middle">• Крок 3: Привіт!</text>

      <!-- Arrow 1 -->
      <path d="M 200 120 L 220 120" stroke="#0033A0" stroke-width="3" fill="none"/>
      <polygon points="220,115 230,120 220,125" fill="#0033A0"/>

      <!-- Box 2: Code / Blocks -->
      <rect x="240" y="30" width="170" height="180" rx="10" fill="#F0F4F8" stroke="#0033A0" stroke-width="2"/>
      <rect x="240" y="30" width="170" height="36" rx="10" fill="#0033A0"/>
      <text x="325" y="53" font-family="sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2. Блоки (Code)</text>
      <rect x="255" y="80" width="140" height="24" rx="4" fill="#FFD700"/>
      <text x="325" y="96" font-family="sans-serif" font-size="11" font-weight="bold" fill="#1A1A1A" text-anchor="middle">коли 🚩 натиснуто</text>
      <rect x="255" y="110" width="140" height="24" rx="4" fill="#4C97FF"/>
      <text x="325" y="126" font-family="sans-serif" font-size="11" fill="#FFFFFF" text-anchor="middle">перемістити на 50</text>
      <rect x="255" y="140" width="140" height="24" rx="4" fill="#9966FF"/>
      <text x="325" y="156" font-family="sans-serif" font-size="11" fill="#FFFFFF" text-anchor="middle">говорити Привіт!</text>

      <!-- Arrow 2 -->
      <path d="M 420 120 L 440 120" stroke="#0033A0" stroke-width="3" fill="none"/>
      <polygon points="440,115 450,120 440,125" fill="#0033A0"/>

      <!-- Box 3: Script -->
      <rect x="460" y="30" width="150" height="180" rx="10" fill="#FFFFFF" stroke="#D9E2F0" stroke-width="2"/>
      <rect x="460" y="30" width="150" height="36" rx="10" fill="#0033A0"/>
      <text x="535" y="53" font-family="sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3. Скрипт (Script)</text>
      <text x="535" y="105" font-family="sans-serif" font-size="32" text-anchor="middle">🧩</text>
      <text x="535" y="145" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0033A0" text-anchor="middle">З'єднані блоки</text>
      <text x="535" y="170" font-family="sans-serif" font-size="11" fill="#52606D" text-anchor="middle">Готова програма</text>

      <!-- Arrow 3 -->
      <path d="M 620 120 L 640 120" stroke="#0033A0" stroke-width="3" fill="none"/>
      <polygon points="640,115 650,120 640,125" fill="#0033A0"/>

      <!-- Box 4: Stage / Output -->
      <rect x="660" y="30" width="120" height="180" rx="10" fill="#FFF9DB" stroke="#FFD700" stroke-width="2"/>
      <rect x="660" y="30" width="120" height="36" rx="10" fill="#FFD700"/>
      <text x="720" y="53" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1A1A1A" text-anchor="middle">4. Сцена (Stage)</text>
      <text x="720" y="100" font-family="sans-serif" font-size="32" text-anchor="middle">🐱 🚩</text>
      <text x="720" y="145" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0033A0" text-anchor="middle">Запуск (Run)</text>
      <text x="720" y="170" font-family="sans-serif" font-size="11" fill="#52606D" text-anchor="middle">Виконання дії</text>
    </svg>
