<svg viewBox="0 0 800 210" role="img" aria-labelledby="svg-title-hai svg-desc-hai" style="display:block;width:100%;height:auto;max-width:800px;margin:18px auto;" xmlns="http://www.w3.org/2000/svg">
      <title id="svg-title-hai">Як працювати з текстом, який запропонував ШІ</title>
      <desc id="svg-desc-hai">Спершу ШІ пропонує чернетку — швидко, але в ній можуть бути помилки. Потім людина перевіряє: чи це правда і чи доречно. Наприкінці людина вирішує, що залишити, що змінити і що додати від себе.</desc>
      <rect x="20" y="20" width="230" height="170" rx="10" fill="#FFFFFF" stroke="#D9E2F0" stroke-width="2"/>
      <rect x="20" y="20" width="230" height="40" rx="10" fill="#E2E8F0"/>
      <text x="135" y="46" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1A1A1A" text-anchor="middle">1. ШІ пропонує</text>
      <text x="135" y="100" font-family="sans-serif" font-size="32" text-anchor="middle">🤖</text>
      <text x="135" y="140" font-family="sans-serif" font-size="15" fill="#1A1A1A" text-anchor="middle">чернетку — швидко,</text>
      <text x="135" y="164" font-family="sans-serif" font-size="15" fill="#52606D" text-anchor="middle">але можуть бути помилки</text>
      <path d="M 256 105 H 278" stroke="#0033A0" stroke-width="3"/><polygon points="278,99 286,105 278,111" fill="#0033A0"/>
      <rect x="290" y="20" width="230" height="170" rx="10" fill="#F0F4F8" stroke="#0033A0" stroke-width="2"/>
      <rect x="290" y="20" width="230" height="40" rx="10" fill="#0033A0"/>
      <text x="405" y="46" font-family="sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2. Людина перевіряє</text>
      <text x="405" y="100" font-family="sans-serif" font-size="32" text-anchor="middle">🔍</text>
      <text x="405" y="140" font-family="sans-serif" font-size="15" fill="#1A1A1A" text-anchor="middle">Чи це правда?</text>
      <text x="405" y="164" font-family="sans-serif" font-size="15" fill="#52606D" text-anchor="middle">Чи це доречно?</text>
      <path d="M 526 105 H 548" stroke="#0033A0" stroke-width="3"/><polygon points="548,99 556,105 548,111" fill="#0033A0"/>
      <rect x="560" y="20" width="220" height="170" rx="10" fill="#FFF9DB" stroke="#B38600" stroke-width="2"/>
      <rect x="560" y="20" width="220" height="40" rx="10" fill="#FFD700"/>
      <text x="670" y="46" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1A1A1A" text-anchor="middle">3. Людина вирішує</text>
      <text x="670" y="100" font-family="sans-serif" font-size="32" text-anchor="middle">✍️</text>
      <text x="670" y="140" font-family="sans-serif" font-size="15" fill="#1A1A1A" text-anchor="middle">що залишити, змінити</text>
      <text x="670" y="164" font-family="sans-serif" font-size="15" fill="#52606D" text-anchor="middle">і що додати своє</text>
    </svg>
