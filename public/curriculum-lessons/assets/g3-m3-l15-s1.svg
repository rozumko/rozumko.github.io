<svg viewBox="0 0 860 200" role="img" aria-labelledby="g3u15a-t g3u15a-d" style="display:block;width:100%;height:auto;margin:16px 0;" xmlns="http://www.w3.org/2000/svg">
    <title id="g3u15a-t">Як модель вчиться на прикладах</title>
    <desc id="g3u15a-d">Спочатку підписані приклади: яблука й банани. Далі модель шукає спільні ознаки. Потім новий приклад. Нарешті передбачення: «це яблуко». Модель може помилитися, якщо приклади були неповними.</desc>
    <rect x="6" y="14" width="190" height="130" rx="12" fill="#EAF0FC" stroke="#0033A0" stroke-width="2"/>
    <text x="101" y="52" text-anchor="middle" font-size="26" font-family="Arial, sans-serif">🍎🍎🍌🍌</text>
    <text x="101" y="88" text-anchor="middle" font-size="17" font-weight="700" fill="#0033A0" font-family="Arial, sans-serif">1. Приклади</text>
    <text x="101" y="114" text-anchor="middle" font-size="15" fill="#3D4757" font-family="Arial, sans-serif">з підписами</text>
    <path d="M200 79 H216" fill="none" stroke="#0033A0" stroke-width="3"/>
    <polygon points="216,72 228,79 216,86" fill="#0033A0"/>
    <rect x="232" y="14" width="190" height="130" rx="12" fill="#FFF9DB" stroke="#B38600" stroke-width="2"/>
    <text x="327" y="52" text-anchor="middle" font-size="26" font-family="Arial, sans-serif">🔍</text>
    <text x="327" y="88" text-anchor="middle" font-size="17" font-weight="700" fill="#7A5A00" font-family="Arial, sans-serif">2. Шукає схоже</text>
    <text x="327" y="114" text-anchor="middle" font-size="15" fill="#3D4757" font-family="Arial, sans-serif">форма, колір</text>
    <path d="M426 79 H442" fill="none" stroke="#0033A0" stroke-width="3"/>
    <polygon points="442,72 454,79 442,86" fill="#0033A0"/>
    <rect x="458" y="14" width="190" height="130" rx="12" fill="#EAF0FC" stroke="#0033A0" stroke-width="2"/>
    <text x="553" y="52" text-anchor="middle" font-size="26" font-family="Arial, sans-serif">🍏❓</text>
    <text x="553" y="88" text-anchor="middle" font-size="17" font-weight="700" fill="#0033A0" font-family="Arial, sans-serif">3. Новий приклад</text>
    <text x="553" y="114" text-anchor="middle" font-size="15" fill="#3D4757" font-family="Arial, sans-serif">якого не бачила</text>
    <path d="M652 79 H668" fill="none" stroke="#0033A0" stroke-width="3"/>
    <polygon points="668,72 680,79 668,86" fill="#0033A0"/>
    <rect x="684" y="14" width="170" height="130" rx="12" fill="#E9F4ED" stroke="#1B6B3A" stroke-width="2"/>
    <text x="769" y="52" text-anchor="middle" font-size="26" font-family="Arial, sans-serif">💬</text>
    <text x="769" y="88" text-anchor="middle" font-size="17" font-weight="700" fill="#155C32" font-family="Arial, sans-serif">4. Передбачення</text>
    <text x="769" y="114" text-anchor="middle" font-size="15" fill="#3D4757" font-family="Arial, sans-serif">«це яблуко»</text>
    <text x="430" y="182" text-anchor="middle" font-size="16" fill="#96271B" font-family="Arial, sans-serif">Модель може помилитися — особливо якщо прикладів мало або вони однакові.</text>
  </svg>
