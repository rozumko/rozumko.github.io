<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Сторінку не знайдено — Розумко</title>
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#3b82f6" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Nunito', system-ui, -apple-system, sans-serif;
      background: #f8fafc;
      color: #1e293b;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
      text-align: center;
    }
    .logo {
      font-size: 1.1rem;
      font-weight: 800;
      color: #3b82f6;
      text-decoration: none;
      margin-bottom: 2.5rem;
      display: block;
    }
    .code {
      font-size: clamp(5rem, 20vw, 8rem);
      font-weight: 800;
      line-height: 1;
      color: #e2e8f0;
      margin-bottom: 1rem;
      letter-spacing: -.04em;
    }
    h1 {
      font-size: clamp(1.25rem, 4vw, 1.75rem);
      font-weight: 700;
      color: #0f172a;
      margin-bottom: .75rem;
    }
    p {
      color: #64748b;
      font-size: .9375rem;
      line-height: 1.6;
      max-width: 26rem;
      margin-bottom: 2rem;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: .5rem;
      background: #3b82f6;
      color: #fff;
      font-family: inherit;
      font-size: .9375rem;
      font-weight: 700;
      padding: .75rem 1.75rem;
      border-radius: 9999px;
      text-decoration: none;
      transition: background .15s;
    }
    .btn:hover { background: #2563eb; }
    .links {
      margin-top: 1.5rem;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: .5rem 1.25rem;
    }
    .links a {
      color: #94a3b8;
      font-size: .875rem;
      text-decoration: none;
      transition: color .15s;
    }
    .links a:hover { color: #3b82f6; }
    .mascot { margin-bottom: 1.5rem; }
  </style>
</head>
<body>
  <a href="/" class="logo">Розумко</a>

  <img class="mascot" src="/images/half/rozumko_hulf_404.png" alt="" aria-hidden="true" width="180" height="180" />
  <div class="code" aria-hidden="true">404</div>
  <h1>Сторінку не знайдено</h1>
  <p>Можливо, посилання застаріло або сторінку перенесено. Поверніться на головну і спробуйте знайти потрібне там.</p>

  <a href="/" class="btn">← На головну</a>

  <nav class="links" aria-label="Корисні посилання">
    <a href="/student.html">Для учнів</a>
    <a href="/teacher.html">Кабінет вчителя</a>
    <a href="/for-parents.html">Для батьків</a>
    <a href="/privacy.html">Конфіденційність</a>
  </nav>
</body>
</html>
