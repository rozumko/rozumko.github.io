services:
  - type: web
    name: rozumko.github.io
    runtime: node
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm run db:migrate:check:prod && node dist/server.js
    autoDeployTrigger: checksPass
    healthCheckPath: /health
    # OPERATIONAL INVARIANT: rate limiting is in-process memory
    # (RATE_LIMIT_STORE=memory). It is correct ONLY on a single instance.
    # Do not raise numInstances above 1 until a shared store (Redis/Valkey)
    # is implemented and tested — see docs/security-model.md.
    numInstances: 1
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: ATTEMPT_SECRET
        sync: false
      # Supabase CA certificate. Required whenever DATABASE_URL requests SSL:
      # node-postgres would otherwise accept ANY certificate for sslmode=require.
      # Same value as the SUPABASE_DB_CA_CERT secret used by deploy.yml.
      - key: SUPABASE_DB_CA_CERT
        sync: false
      # Optional until a payment provider is selected: without this value the
      # webhook responds 503 fail-closed, so deploying without it is safe.
      - key: HOME_PAYMENT_WEBHOOK_SECRET
        sync: false
      # Fine-grained token scoped to this repository with Actions: write only.
      - key: CONTENT_PUBLISH_GITHUB_TOKEN
        sync: false
      - key: CONTENT_PUBLISH_GITHUB_REPOSITORY
        sync: false
      # Must match the GitHub Actions secret of the same name (32+ chars).
      - key: CONTENT_PUBLISH_CALLBACK_SECRET
        sync: false
      - key: NODE_ENV
        value: production
