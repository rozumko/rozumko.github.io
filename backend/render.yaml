services:
  - type: web
    name: megarozum-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: node dist/server.js
    autoDeployTrigger: checksPass
    healthCheckPath: /health
    # OPERATIONAL INVARIANT: rate limiting is in-process memory
    # (RATE_LIMIT_STORE=memory). It is correct ONLY on a single instance.
    # Do not raise numInstances above 1 until a shared store (Redis/Valkey)
    # is implemented and tested — see docs/security-model.md.
    numInstances: 1
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: ATTEMPT_SECRET
        sync: false
      - key: NODE_ENV
        value: production
