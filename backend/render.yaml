services:
  - type: web
    name: megarozum-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: node dist/server.js
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: ATTEMPT_SECRET
        sync: false
      - key: NODE_ENV
        value: production
