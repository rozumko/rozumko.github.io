<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Ігри — Розумко</title>
  <meta name="description" content="Безкоштовні розвивальні ігри Розумко для 1–4 класів: сортування за ознакою, класифікація та логіка. Без реєстрації і без збору дитячих даних." />
  <meta name="keywords" content="розвивальні ігри для дітей, сортування, класифікація, логічні ігри 1-4 клас" />
  <link rel="canonical" href="https://rozumko.com/games.html" />

  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://rozumko.com/games.html" />
  <meta property="og:title" content="Ігри — Розумко" />
  <meta property="og:description" content="Безкоштовні розвивальні ігри: сортування за ознакою, класифікація та логіка для 1–4 класів." />
  <meta property="og:image" content="https://rozumko.com/android-chrome-512x512.png" />

  <meta name="theme-color" content="#3b82f6" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="tokens.css"/>
  <link rel="stylesheet" href="style.css"/>
</head>
<body class="app-page">
  <a href="#main-content" class="skip-link">Перейти до основного контенту</a>
  <div id="site-header"></div>

  <main id="main-content" class="app-main" tabindex="-1">

    <section id="games-menu">
      <h1 class="app-title">Ігри</h1>
      <p class="app-subtitle">Обери гру — сортуй, думай і перемагай!</p>
      <div class="mission-grid" role="group" aria-label="Вибір гри">
        <button class="game-pick-btn mission-card mission-card--think" data-game="attributes">
          <span class="mission-card__icon" aria-hidden="true">🧺</span>
          <span class="mission-card__title">Розумне сортування</span>
          <span class="mission-card__meta">Розклади предмети за ознакою · 5 рівнів</span>
        </button>
        <button class="game-pick-btn mission-card mission-card--inf" data-game="infosort">
          <span class="mission-card__icon" aria-hidden="true">📡</span>
          <span class="mission-card__title">ІнфоСорт</span>
          <span class="mission-card__meta">Як ми отримуємо інформацію · 2 рівні</span>
        </button>
      </div>
    </section>

    <section id="game-area" class="hidden">
      <div class="app-actions" style="justify-content:flex-start; margin-bottom: var(--sp-4);">
        <button id="game-back-btn" class="btn-ghost">← До списку ігор</button>
      </div>
      <div id="sorting-game" aria-label="Ігрове поле"></div>
    </section>

  </main>

  <div id="site-footer"></div>
  <script type="module" src="layout.js"></script>
  <script type="module" src="games.js"></script>
</body>
</html>
