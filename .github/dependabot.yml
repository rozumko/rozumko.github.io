version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Kyiv
    open-pull-requests-limit: 5
    groups:
      frontend-dev-dependencies:
        dependency-type: development
    ignore:
      # typescript-eslint peer-requires typescript <6.1.0; TypeScript majors
      # must be taken deliberately together with a typescript-eslint upgrade.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: "06:30"
      timezone: Europe/Kyiv
    open-pull-requests-limit: 5
    groups:
      backend-production-dependencies:
        dependency-type: production
      backend-development-dependencies:
        dependency-type: development
